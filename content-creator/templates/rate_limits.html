{% extends "base.html" %}
{% set active = "rate_limits" %}
{% block title %}Rate Limits — MAJD{% endblock %}

{% block head %}
<style>
  .rl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
    padding: 1.5rem;
  }
  .rl-card {
    background: rgba(15, 15, 30, 0.7);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 1.5rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .rl-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-accent, var(--success));
  }
  .rl-card.status-green { --card-accent: #22c55e; border-color: rgba(34,197,94,0.15); }
  .rl-card.status-yellow { --card-accent: #eab308; border-color: rgba(234,179,8,0.15); }
  .rl-card.status-red { --card-accent: #ef4444; border-color: rgba(239,68,68,0.2); box-shadow: 0 0 24px rgba(239,68,68,0.08); }
  .rl-card.status-gray { --card-accent: #6b7280; }

  .rl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .rl-provider { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; letter-spacing: 0.02em; }
  .rl-badge {
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
    padding: 0.2rem 0.6rem; border-radius: 999px; letter-spacing: 0.05em;
  }
  .rl-badge.healthy { background: rgba(34,197,94,0.15); color: #22c55e; }
  .rl-badge.warning { background: rgba(234,179,8,0.15); color: #eab308; }
  .rl-badge.blocked { background: rgba(239,68,68,0.2); color: #ef4444; }
  .rl-badge.offline { background: rgba(107,114,128,0.15); color: #6b7280; }

  .rl-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .rl-stat { display: flex; flex-direction: column; gap: 0.15rem; }
  .rl-stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
  .rl-stat-value { font-size: 1rem; font-weight: 600; color: #f1f5f9; }
  .rl-stat-value.accent-green { color: #22c55e; }
  .rl-stat-value.accent-yellow { color: #eab308; }
  .rl-stat-value.accent-red { color: #ef4444; }

  .rl-bar-track {
    width: 100%; height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 3px; margin-top: 1rem; overflow: hidden;
  }
  .rl-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.5s ease, background 0.5s ease;
  }

  .rl-page-header {
    padding: 1.5rem 1.5rem 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .rl-page-title { font-size: 1.4rem; font-weight: 700; color: #e2e8f0; }
  .rl-refresh-tag { font-size: 0.75rem; color: #64748b; }

  .rl-empty {
    grid-column: 1 / -1;
    text-align: center; padding: 3rem 1rem; color: #64748b;
  }
  .rl-proxy-down {
    grid-column: 1 / -1;
    text-align: center; padding: 4rem 1rem;
  }
  .rl-proxy-down-title { font-size: 1.2rem; font-weight: 600; color: #ef4444; margin-bottom: 0.5rem; }
  .rl-proxy-down-msg { color: #94a3b8; font-size: 0.9rem; }
</style>
{% endblock %}

{% block content %}
<div class="rl-page-header">
  <span class="rl-page-title">Rate Limit Monitor</span>
  <span class="rl-refresh-tag" id="rl-last-refresh">--</span>
</div>
<div class="rl-grid" id="rl-grid"></div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var PROXY_URL = 'http://localhost:8082/api/rate-limits/status';
  var REFRESH_MS = 15000;
  var grid = document.getElementById('rl-grid');
  var refreshEl = document.getElementById('rl-last-refresh');

  function colorClass(remaining, limit, blocked) {
    if (blocked) return 'red';
    if (limit <= 0) return 'gray';
    var pct = remaining / limit;
    if (pct > 0.5) return 'green';
    if (pct > 0.15) return 'yellow';
    return 'red';
  }

  function badgeLabel(blocked, remaining, limit) {
    if (blocked) return 'blocked';
    if (limit <= 0) return 'offline';
    if (remaining / limit > 0.5) return 'healthy';
    if (remaining / limit > 0.15) return 'warning';
    return 'critical';
  }

  function badgeClass(blocked, remaining, limit) {
    if (blocked) return 'blocked';
    if (limit <= 0) return 'offline';
    if (remaining / limit > 0.5) return 'healthy';
    if (remaining / limit > 0.15) return 'warning';
    return 'blocked';
  }

  function accentClass(blocked, remaining, limit) {
    if (blocked) return 'accent-red';
    if (limit <= 0) return '';
    var pct = remaining / limit;
    if (pct > 0.5) return 'accent-green';
    if (pct > 0.15) return 'accent-yellow';
    return 'accent-red';
  }

  function formatSeconds(s) {
    if (s <= 0) return '0s';
    if (s < 60) return Math.round(s) + 's';
    var m = Math.floor(s / 60);
    var sec = Math.round(s % 60);
    return m + 'm ' + sec + 's';
  }

  function buildCard(p) {
    var blocked = p.is_blocked || false;
    var remaining = p.requests_remaining || 0;
    var limit = p.requests_limit || 1;
    var cc = colorClass(remaining, limit, blocked);
    var bl = badgeLabel(blocked, remaining, limit);
    var bc = badgeClass(blocked, remaining, limit);
    var ac = accentClass(blocked, remaining, limit);

    var card = document.createElement('div');
    card.className = 'rl-card status-' + cc;

    // Header
    var header = document.createElement('div');
    header.className = 'rl-header';

    var nameSpan = document.createElement('span');
    nameSpan.className = 'rl-provider';
    nameSpan.textContent = p.provider_name;

    var badge = document.createElement('span');
    badge.className = 'rl-badge ' + bc;
    badge.textContent = bl;

    header.appendChild(nameSpan);
    header.appendChild(badge);
    card.appendChild(header);

    // Stats grid
    var stats = document.createElement('div');
    stats.className = 'rl-stats';

    var fields = [
      { label: 'Remaining', value: remaining + ' / ' + limit, accent: ac },
      { label: 'Window Reset', value: formatSeconds(p.window_reset_seconds || 0), accent: '' },
      { label: 'Concurrency', value: p.current_concurrency + ' / ' + p.max_concurrency, accent: '' },
      { label: 'Blocked', value: blocked ? formatSeconds(p.blocked_remaining_seconds || 0) : 'No', accent: blocked ? 'accent-red' : 'accent-green' },
    ];

    for (var i = 0; i < fields.length; i++) {
      var stat = document.createElement('div');
      stat.className = 'rl-stat';
      var lbl = document.createElement('span');
      lbl.className = 'rl-stat-label';
      lbl.textContent = fields[i].label;
      var val = document.createElement('span');
      val.className = 'rl-stat-value' + (fields[i].accent ? ' ' + fields[i].accent : '');
      val.textContent = fields[i].value;
      stat.appendChild(lbl);
      stat.appendChild(val);
      stats.appendChild(stat);
    }
    card.appendChild(stats);

    // Progress bar
    var barTrack = document.createElement('div');
    barTrack.className = 'rl-bar-track';
    var barFill = document.createElement('div');
    barFill.className = 'rl-bar-fill';
    var pct = limit > 0 ? Math.max(0, Math.min(100, (remaining / limit) * 100)) : 0;
    barFill.style.width = pct + '%';
    var barColor = cc === 'green' ? '#22c55e' : cc === 'yellow' ? '#eab308' : cc === 'red' ? '#ef4444' : '#6b7280';
    barFill.style.background = barColor;
    barTrack.appendChild(barFill);
    card.appendChild(barTrack);

    return card;
  }

  function buildProxyDown() {
    var wrap = document.createElement('div');
    wrap.className = 'rl-proxy-down';
    var title = document.createElement('div');
    title.className = 'rl-proxy-down-title';
    title.textContent = 'Proxy Unavailable';
    var msg = document.createElement('div');
    msg.className = 'rl-proxy-down-msg';
    msg.textContent = 'Cannot reach ' + PROXY_URL + '. Start the proxy with start-proxy and refresh.';
    wrap.appendChild(title);
    wrap.appendChild(msg);
    return wrap;
  }

  function render(data) {
    grid.innerHTML = '';
    var providers = data.providers || [];
    if (providers.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'rl-empty';
      empty.textContent = 'No provider rate limiters active yet. Limits appear after the first request.';
      grid.appendChild(empty);
      return;
    }
    for (var i = 0; i < providers.length; i++) {
      grid.appendChild(buildCard(providers[i]));
    }
  }

  async function fetchStatus() {
    try {
      var r = await fetch(PROXY_URL, { signal: AbortSignal.timeout(5000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var data = await r.json();
      render(data);
    } catch (e) {
      grid.innerHTML = '';
      grid.appendChild(buildProxyDown());
    }
    if (refreshEl) {
      refreshEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
    }
  }

  fetchStatus();
  setInterval(fetchStatus, REFRESH_MS);
})();
</script>
{% endblock %}
