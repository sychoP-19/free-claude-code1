{% extends "base.html" %}
{% set active = "ideas" %}
{% block title %}Idea Inbox{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">IDEA INBOX</div>
    <div class="page-subtitle">DROP RAW IDEAS · AI RANKS BY VIRALITY × EFFORT × FIT</div>
  </div>
  <div class="page-actions">
    <button class="btn" onclick="rankIdeas()"><span>RANK ALL</span></button>
  </div>
</div>

<div class="bento-grid">
  <div class="bento-tile bento-tile--strip holo-border">
    <div class="bento-tile-label">Add an Idea</div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <input id="idea-text" class="hud-input" placeholder="What's the idea? (text, URL, anything)" style="flex:1;"/>
      <button class="btn btn-primary" onclick="addIdea()"><span>ADD</span></button>
    </div>
  </div>
  <div class="bento-tile bento-tile--strip">
    <div class="bento-tile-label">Queue (ranked)</div>
    <table class="data-table" style="width:100%;margin-top:10px;">
      <thead><tr><th>#</th><th>Idea</th><th>Source</th><th>Score</th><th>Status</th><th>Action</th></tr></thead>
      <tbody id="idea-rows"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function emptyRow(msg, span) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = span; td.className = 'text-muted text-mono text-xs';
  td.style.textAlign = 'center'; td.style.padding = '24px';
  td.textContent = msg;
  tr.appendChild(td);
  return tr;
}
async function loadIdeas() {
  try {
    const r = await fetch('/api/ideas');
    const j = await r.json();
    const tbody = document.getElementById('idea-rows');
    tbody.textContent = '';
    if (!j.items || !j.items.length) {
      tbody.appendChild(emptyRow('No ideas yet — drop one above.', 6));
      return;
    }
    j.items.forEach((it, i) => {
      const tr = document.createElement('tr');
      const cells = [
        String(i+1),
        it.text,
        it.source || '—',
        it.score ? Number(it.score).toFixed(1) : '—',
        it.status || 'new',
      ];
      cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
      const act = document.createElement('td');
      const promoteBtn = document.createElement('button');
      promoteBtn.className = 'btn'; promoteBtn.style.fontSize='10px'; promoteBtn.style.padding='3px 8px';
      promoteBtn.textContent = 'Blog it';
      promoteBtn.onclick = async () => {
        await fetch('/api/pipelines/blog/run', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({topic: it.text})});
        toast({text:'Promoted to blog pipeline', level:'ok'});
        await fetch('/api/ideas/' + it.id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'queued'})});
        loadIdeas();
      };
      act.appendChild(promoteBtn);
      tr.appendChild(act);
      tbody.appendChild(tr);
    });
  } catch(e) { toast({text:e.message, level:'err'}); }
}
async function addIdea() {
  const text = document.getElementById('idea-text').value.trim();
  if (!text) return;
  await fetch('/api/ideas', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
  document.getElementById('idea-text').value = '';
  toast({text:'Idea saved', level:'ok'});
  loadIdeas();
}
async function rankIdeas() {
  toast({text:'Scoring with AI…', level:'info'});
  const r = await fetch('/api/ideas/rank', { method:'POST' });
  const j = await r.json();
  toast({text: `Scored ${j.scored} ideas`, level:'ok'});
  loadIdeas();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('idea-rows').appendChild(emptyRow('Loading…', 6));
  loadIdeas();
});
</script>
{% endblock %}
