{% extends "base.html" %}
{% set active = "library" %}
{% block title %}Asset Library{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">ASSET LIBRARY</div>
    <div class="page-subtitle">EVERY GENERATED FILE · SEARCHABLE BY CAPTION, TAG, OR PATH</div>
  </div>
</div>

<div class="bento-grid">
  <div class="bento-tile bento-tile--quarter holo-border">
    <div class="bento-tile-label">Total Assets</div>
    <div class="bento-hero-num" id="lib-total">—</div>
  </div>
  <div class="bento-tile bento-tile--quarter">
    <div class="bento-tile-label">Total Bytes</div>
    <div class="bento-hero-num" id="lib-bytes" style="font-size:28px;">—</div>
  </div>
  <div class="bento-tile bento-tile--half">
    <div class="bento-tile-label">By Kind</div>
    <div id="lib-kinds" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>

  <div class="bento-tile bento-tile--strip scanline">
    <div class="bento-tile-label">Search</div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <input id="lib-q" class="hud-input" placeholder="caption, tag, or path…" style="flex:1;" oninput="searchLib()"/>
      <select id="lib-kind" class="hud-input" style="width:160px;" onchange="searchLib()">
        <option value="">all kinds</option>
        <option value="video">video</option>
        <option value="audio">audio</option>
        <option value="image">image</option>
        <option value="text">text</option>
      </select>
    </div>
  </div>

  <div class="bento-tile bento-tile--strip">
    <div class="bento-tile-label">Results</div>
    <div id="lib-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px;"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadStats() {
  const r = await fetch('/api/library/stats');
  const j = await r.json();
  document.getElementById('lib-total').textContent = (j.total||0).toLocaleString();
  document.getElementById('lib-bytes').textContent = j.bytes_human || '0 B';
  const k = document.getElementById('lib-kinds'); k.textContent='';
  Object.entries(j.by_kind||{}).forEach(([kind,n]) => {
    const b = document.createElement('span');
    b.className='badge badge-blue';
    b.textContent = kind + ': ' + n;
    k.appendChild(b);
  });
}
async function searchLib() {
  const q = document.getElementById('lib-q').value.trim();
  const kind = document.getElementById('lib-kind').value;
  const url = '/api/library/search?q=' + encodeURIComponent(q) + '&kind=' + encodeURIComponent(kind);
  const r = await fetch(url);
  const j = await r.json();
  const grid = document.getElementById('lib-grid'); grid.textContent='';
  (j.items||[]).forEach(it => {
    const card = document.createElement('div');
    card.className='bento-tile';
    card.style.padding='10px';
    const path = it.path.replace(/.*outputs/, 'outputs').replace(/\\\\/g,'/');
    if (it.kind === 'image') {
      const img = document.createElement('img');
      img.src = '/' + path; img.style.cssText='width:100%;height:120px;object-fit:cover;border-radius:6px;';
      card.appendChild(img);
    } else if (it.kind === 'video') {
      const v = document.createElement('video'); v.controls=true; v.src='/'+path; v.style.cssText='width:100%;height:120px;object-fit:cover;border-radius:6px;background:#000;';
      card.appendChild(v);
    } else if (it.kind === 'audio') {
      const a = document.createElement('audio'); a.controls=true; a.src='/'+path; a.style.width='100%';
      card.appendChild(a);
    } else {
      const t = document.createElement('div'); t.style.cssText='font-size:24px;text-align:center;padding:30px;color:var(--blue);';
      t.textContent='📄'; card.appendChild(t);
    }
    const cap = document.createElement('div'); cap.style.cssText='font-size:11px;margin-top:6px;color:var(--white);';
    cap.textContent = it.caption || it.kind;
    const meta = document.createElement('div'); meta.style.cssText='font-size:9px;color:var(--muted);margin-top:2px;font-family:var(--font-data,monospace);';
    meta.textContent = it.size_human + ' · ' + (it.exists ? 'ok' : 'missing');
    card.appendChild(cap); card.appendChild(meta);
    grid.appendChild(card);
  });
}
document.addEventListener('DOMContentLoaded', () => { loadStats(); searchLib(); });
</script>
{% endblock %}
