<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamora Homes — Inmuebles en Zamora, Michoacán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f1e8;
  --surface: #fffcf7;
  --surface2: #f3ece0;
  --border: #e0d5c4;
  --border-strong: #c9b89e;
  --text: #2c2418;
  --text2: #8a7b68;
  --accent: #c2553a;
  --accent2: #9e3f28;
  --accent-light: rgba(194,85,58,0.07);
  --copper: #b87333;
  --green: #4a7c59;
  --green-light: rgba(74,124,89,0.1);
  --blue: #3a6b8c;
  --purple: #6b5b8a;
  --red: #c24a3a;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 4px rgba(44,36,24,0.06), 0 1px 2px rgba(44,36,24,0.03);
  --shadow-lg: 0 8px 32px rgba(44,36,24,0.1), 0 2px 8px rgba(44,36,24,0.04);
  --shadow-card-hover: 0 12px 40px rgba(44,36,24,0.12), 0 4px 12px rgba(44,36,24,0.06);
  --source-i24: #c2553a;
  --source-ml: #c9a227;
  --source-va: #3a6b8c;
  --source-s2: #4a7c59;
  --source-fb: #4a6fa5;
  --status-saved: #8a7b68;
  --status-applied: #3a6b8c;
  --status-interviewing: #6b5b8a;
  --status-offer: #4a7c59;
  --status-rejected: #c24a3a;
  --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  background-image: var(--grain);
  color: var(--text);
  line-height: 1.55;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }

/* ── App Shell ──────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
.header {
  grid-column: 1 / -1;
  background: var(--surface);
  border-bottom: 2px solid var(--border-strong);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 50;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--copper), transparent);
  opacity: 0.4;
}

.logo {
  display: flex;
  align-items: baseline;
  gap: 2px;
}

.logo-serif {
  font-family: var(--serif);
  font-size: 1.4rem;
  color: var(--text);
  letter-spacing: -0.01em;
}

.logo-accent {
  font-family: var(--serif);
  font-size: 1.4rem;
  color: var(--accent);
}

.logo-tagline {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text2);
  margin-left: 10px;
  position: relative;
  top: -1px;
}

.header-badges { display: flex; gap: 6px; align-items: center; }
.badge {
  font-size: 0.62rem;
  padding: 3px 10px;
  border-radius: 99px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.badge-city { background: var(--accent-light); color: var(--accent2); border: 1px solid rgba(194,85,58,0.15); }
.badge-online { background: var(--green-light); color: var(--green); border: 1px solid rgba(74,124,89,0.15); }

.header-stats {
  font-family: var(--serif);
  font-size: 0.82rem;
  color: var(--text2);
}

.header-tabs { display: flex; gap: 4px; }
.header-tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--text2);
  transition: all 0.2s;
  letter-spacing: 0.01em;
}
.header-tab:hover { border-color: var(--copper); color: var(--text); }
.header-tab.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}

/* ── Left Sidebar ───────────────────────────────────────────────────────── */
.sidebar-left {
  grid-column: 1;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 16px;
}

.sidebar-left::-webkit-scrollbar { width: 4px; }
.sidebar-left::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

.filter-section { margin-bottom: 20px; }
.filter-section-title {
  font-family: var(--serif);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--copper);
  font-weight: 400;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.filter-group { margin-bottom: 12px; }
.filter-group label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  letter-spacing: 0.01em;
}
.filter-group select, .filter-group input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text);
  font-size: 0.78rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  -webkit-appearance: none;
}
.filter-group select:focus, .filter-group input:focus {
  border-color: var(--copper);
  box-shadow: 0 0 0 3px rgba(184,115,51,0.1);
}

.btn {
  padding: 9px 18px;
  border: none;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 700;
  transition: all 0.2s;
  width: 100%;
  letter-spacing: 0.02em;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(194,85,58,0.2);
}
.btn-primary:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(194,85,58,0.25); }
.btn-internet {
  background: var(--green);
  color: #fff;
  box-shadow: 0 2px 8px rgba(74,124,89,0.2);
}
.btn-internet:hover { background: #3b6a4a; transform: translateY(-1px); }
.btn-internet:disabled { opacity: 0.6; cursor: wait; transform: none; }
.btn-ghost {
  background: transparent;
  color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--text2); }
.btn-sm { padding: 5px 12px; font-size: 0.7rem; width: auto; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

.sort-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.sort-row label { font-size: 0.72rem; font-weight: 600; color: var(--text2); white-space: nowrap; }
.sort-row select {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  font-size: 0.74rem;
  font-family: inherit;
}

.portal-links { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.portal-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-decoration: none;
  color: var(--text);
  font-size: 0.76rem;
  font-weight: 500;
  transition: all 0.2s;
}
.portal-link:hover { border-color: var(--copper); background: rgba(184,115,51,0.06); text-decoration: none; }
.portal-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font-size: 0.55rem;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

/* ── Center Panel ───────────────────────────────────────────────────────── */
.center-panel {
  grid-column: 2;
  overflow-y: auto;
  padding: 20px 24px;
  background: var(--bg);
  background-image: var(--grain);
}

.center-panel::-webkit-scrollbar { width: 6px; }
.center-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }

.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.results-count { font-size: 0.8rem; color: var(--text2); }
.results-count strong { color: var(--text); font-weight: 700; }
.client-filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.client-filter-row select {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 0.74rem;
  font-family: inherit;
}

.section-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 24px 0 14px;
  font-family: var(--serif);
  font-size: 0.92rem;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 0.01em;
}
.section-divider::before {
  content: '';
  width: 3px;
  height: 16px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border-strong), transparent);
}
.section-divider .count {
  font-family: var(--sans);
  font-size: 0.66rem;
  font-weight: 700;
  color: var(--text2);
  background: var(--surface2);
  padding: 2px 9px;
  border-radius: 99px;
  border: 1px solid var(--border);
}

/* ── Grid & Cards ─────────────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}

.skeleton-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.skeleton-image {
  height: 180px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
}
.skeleton-body { padding: 16px; }
.skeleton-line {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  margin-bottom: 10px;
}
.skeleton-line.short { width: 60%; }
.skeleton-line.med { width: 80%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Property Card ─────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: default;
  position: relative;
}
.card:hover {
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-3px);
  border-color: var(--border-strong);
}

.card-image {
  height: 190px;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.card:hover .card-image img { transform: scale(1.03); }
.card-image-placeholder { font-size: 3rem; opacity: 0.2; }

.card-tag {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  backdrop-filter: blur(8px);
}
.tag-venta { background: rgba(74,124,89,0.9); color: #fff; }
.tag-renta { background: rgba(58,107,140,0.9); color: #fff; }

.card-source-chip {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #fff;
  backdrop-filter: blur(8px);
}

.card-body { padding: 14px 16px 10px; }
.card-price {
  font-family: var(--serif);
  font-size: 1.3rem;
  color: var(--accent2);
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.card-title {
  font-size: 0.88rem;
  font-weight: 600;
  margin-bottom: 4px;
  line-height: 1.35;
}
.card-location {
  font-size: 0.76rem;
  color: var(--text2);
  margin-bottom: 10px;
}
.card-features { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.feature {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  color: var(--text2);
  background: var(--surface2);
  padding: 3px 9px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.feature svg { width: 13px; height: 13px; }
.card-desc {
  font-size: 0.76rem;
  color: var(--text2);
  line-height: 1.55;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
}
.card-contact { font-size: 0.72rem; flex: 1; min-width: 0; }
.card-contact-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-contact-phone { color: var(--copper); }
.card-actions { display: flex; gap: 8px; align-items: center; }
.card-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--purple);
  text-decoration: none;
  white-space: nowrap;
}
.card-link:hover { text-decoration: underline; }

/* Save button */
.save-btn {
  background: none;
  border: none;
  font-size: 1.3rem;
  color: var(--border-strong);
  transition: all 0.25s;
  padding: 2px;
  line-height: 1;
}
.save-btn:hover { color: var(--accent); transform: scale(1.2); }
.save-btn.saved { color: var(--accent); }

mark {
  background: rgba(194,85,58,0.15);
  color: inherit;
  border-radius: 2px;
  padding: 0 3px;
  border-bottom: 2px solid rgba(194,85,58,0.3);
}

/* ── Right Sidebar ──────────────────────────────────────────────────────── */
.sidebar-right {
  grid-column: 3;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 16px;
}

.sidebar-right::-webkit-scrollbar { width: 4px; }
.sidebar-right::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

.saved-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.saved-title {
  font-family: var(--serif);
  font-size: 1rem;
  letter-spacing: 0.01em;
}
.saved-count {
  font-size: 0.66rem;
  font-weight: 700;
  color: var(--accent2);
  background: var(--accent-light);
  padding: 3px 10px;
  border-radius: 99px;
  border: 1px solid rgba(194,85,58,0.12);
}

.view-toggle { display: flex; gap: 4px; margin-bottom: 14px; }
.view-toggle button {
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text2);
  transition: all 0.2s;
  font-family: inherit;
}
.view-toggle button.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}

.saved-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  position: relative;
  transition: all 0.2s;
  border-left: 3px solid transparent;
}
.saved-card:hover { border-color: var(--copper); border-left-color: var(--copper); }

.saved-card-price {
  font-family: var(--serif);
  font-size: 0.9rem;
  color: var(--accent2);
}
.saved-card-title {
  font-size: 0.76rem;
  font-weight: 600;
  margin: 2px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.saved-card-source { font-size: 0.66rem; color: var(--text2); margin-bottom: 8px; }
.saved-card-status { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.saved-card-status select {
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.7rem;
  background: var(--surface);
  font-family: inherit;
  flex: 1;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.saved-card-actions { display: flex; gap: 8px; align-items: center; }
.saved-card-actions button {
  background: none;
  border: none;
  font-size: 0.78rem;
  color: var(--text2);
  transition: color 0.2s;
  padding: 2px;
}
.saved-card-actions button:hover { color: var(--red); }

.saved-notes-toggle {
  font-size: 0.68rem;
  color: var(--copper);
  cursor: pointer;
  margin-top: 4px;
  transition: color 0.15s;
}
.saved-notes-toggle:hover { color: var(--accent2); }
.saved-notes-area { margin-top: 6px; }
.saved-notes-area textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.72rem;
  font-family: inherit;
  resize: vertical;
  min-height: 50px;
  background: var(--surface);
  transition: border-color 0.2s;
}
.saved-notes-area textarea:focus { outline: none; border-color: var(--copper); }

.bulk-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.bulk-row label { font-size: 0.72rem; color: var(--text2); display: flex; align-items: center; gap: 5px; }
.bulk-row button {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text2);
  transition: all 0.2s;
  font-family: inherit;
}
.bulk-row button:hover { border-color: var(--red); color: var(--red); }

/* ── Kanban ─────────────────────────────────────────────────────────────── */
.kanban { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
.kanban-col { min-width: 130px; flex: 1; background: var(--surface2); border-radius: 10px; padding: 10px; border: 1px solid var(--border); }
.kanban-col-header {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 5px 10px;
  border-radius: 6px;
  margin-bottom: 8px;
  color: #fff;
  text-align: center;
}
.kanban-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 6px;
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 0.2s;
}
.kanban-card:hover { border-color: var(--copper); }
.kanban-card-title { font-weight: 600; margin-bottom: 2px; }
.kanban-card-price { font-family: var(--serif); font-weight: 400; color: var(--accent2); font-size: 0.74rem; }

/* ── Stats ──────────────────────────────────────────────────────────────── */
.stats-panel { display: none; padding: 24px; }
.stats-panel.active { display: block; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--accent);
  border-radius: 3px 3px 0 0;
}
.stat-card .stat-value {
  font-family: var(--serif);
  font-size: 2rem;
  color: var(--accent2);
  line-height: 1;
  margin-bottom: 6px;
}
.stat-card .stat-label {
  font-size: 0.68rem;
  color: var(--text2);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.stat-section-title {
  font-family: var(--serif);
  font-size: 0.92rem;
  margin-bottom: 14px;
  padding-left: 10px;
  border-left: 3px solid var(--copper);
}

.mini-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.mini-bar-label {
  font-size: 0.74rem;
  color: var(--text);
  min-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mini-bar-track {
  flex: 1;
  height: 16px;
  background: var(--surface2);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.mini-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

/* ── Modal ──────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,36,24,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  max-width: 660px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--border);
  box-shadow: 0 24px 64px rgba(44,36,24,0.2);
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 2px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.modal-header h2 {
  font-family: var(--serif);
  font-size: 1.2rem;
  font-weight: 400;
  line-height: 1.3;
}
.modal-close {
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 1.2rem;
  cursor: pointer;
  color: var(--text2);
  padding: 4px 10px;
  border-radius: 8px;
  transition: all 0.2s;
  line-height: 1;
}
.modal-close:hover { color: var(--text); border-color: var(--text2); }

.modal-body { padding: 24px; }
.modal-image {
  height: 260px;
  background: var(--surface2);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  overflow: hidden;
}
.modal-image img { width: 100%; height: 100%; object-fit: cover; }
.modal-image-placeholder { font-size: 4rem; opacity: 0.12; }

.modal-price {
  font-family: var(--serif);
  font-size: 1.6rem;
  color: var(--accent2);
  margin-bottom: 10px;
}
.modal-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 0.8rem;
  color: var(--text2);
}
.modal-meta span {
  background: var(--surface2);
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.modal-desc { font-size: 0.86rem; color: var(--text); line-height: 1.7; margin-bottom: 16px; }
.modal-features { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.modal-features .feature { padding: 5px 12px; }
.modal-contact {
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
}
.modal-contact h3 {
  font-family: var(--serif);
  font-size: 0.88rem;
  font-weight: 400;
  margin-bottom: 8px;
  color: var(--text);
}
.modal-contact-info { font-size: 0.82rem; line-height: 1.8; }

.modal-source-link { margin-top: 12px; }
.modal-source-link a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: var(--green);
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-size: 0.82rem;
  font-weight: 600;
  transition: all 0.2s;

}
.modal-source-link a:hover { background: #3b6a4a; text-decoration: none; }

/* ── Empty state ──────────────────────────────────────────────────────── */
.empty { text-align: center; padding: 60px 24px; color: var(--text2); }
.empty-icon { font-size: 2.5rem; margin-bottom: 8px; opacity: 0.25; }

.kb-hint {
  font-size: 0.6rem;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  margin-left: 4px;
  font-family: monospace;
}

.search-history-tip { font-size: 0.64rem; color: var(--text2); margin-top: 3px; font-style: italic; }

/* ── Responsive ────────────────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .app { grid-template-columns: 240px 1fr; }
  .sidebar-right { display: none; }
  .sidebar-right.mobile-open {
    display: block;
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 320px;
    z-index: 100;
    box-shadow: -8px 0 32px rgba(44,36,24,0.12);
  }
}
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar-left { display: none; }
  .sidebar-left.mobile-open {
    display: block;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 280px;
    z-index: 100;

  }
  .center-panel { padding: 14px; }
  .grid { grid-template-columns: 1fr; }
  .logo-tagline { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div style="display:flex;align-items:baseline;gap:10px;">
      <div class="logo">
        <span class="logo-serif">Zamora</span><span class="logo-accent">Homes</span>
      </div>
      <span class="logo-tagline">Inmuebles en Michoacán</span>
      <div class="header-badges">
        <span class="badge badge-city">Zamora de Hidalgo</span>
        <span class="badge badge-online">+ Internet</span>
      </div>
    </div>
    <div class="header-tabs">
      <button class="header-tab active" id="tabResults" onclick="switchTab('results')">Resultados</button>
      <button class="header-tab" id="tabSaved" onclick="switchTab('results');toggleSavedPanel()">Guardados</button>
      <button class="header-tab" id="tabStats" onclick="switchTab('stats')">Estadísticas</button>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>

  <!-- Left Sidebar: Filters -->
  <div class="sidebar-left" id="sidebarLeft">
    <div class="filter-section">
      <div class="filter-section-title">Búsqueda</div>
      <div class="filter-group">
        <label>Buscar <span class="kb-hint">/</span></label>
        <input type="text" id="filterKeyword" placeholder="alberca, centro, jardín..." list="searchHistory">
        <datalist id="searchHistory"></datalist>
        <div class="search-history-tip">Historial auto-completa</div>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-section-title">Filtros</div>
      <div class="filter-group">
        <label>Operación</label>
        <select id="filterType">
          <option value="all">Venta y Renta</option>
          <option value="venta">Venta</option>
          <option value="renta">Renta</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Tipo</label>
        <select id="filterProperty">
          <option value="all">Todos</option>
          <option value="casa">Casa</option>
          <option value="departamento">Departamento</option>
          <option value="terreno">Terreno</option>
          <option value="local">Local/Oficina</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Colonia</label>
        <select id="filterNeighborhood">
          <option value="all">Todas</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Recámaras mín</label>
        <select id="filterBedrooms">
          <option value="">Cualquiera</option>
          <option value="1">1+</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Precio mín</label>
        <input type="number" id="filterMinPrice" placeholder="$0">
      </div>
      <div class="filter-group">
        <label>Precio máx</label>
        <input type="number" id="filterMaxPrice" placeholder="Sin límite">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-section-title">Opciones</div>
      <div class="sort-row">
        <label>Ordenar:</label>
        <select id="sortSelect">
          <option value="default">Relevancia</option>
          <option value="price-asc">Precio ↑</option>
          <option value="price-desc">Precio ↓</option>
          <option value="area-desc">Área ↓</option>
          <option value="title-asc">Nombre A-Z</option>
        </select>
      </div>
    </div>

    <div class="filter-section">
      <div class="btn-row" style="margin-bottom:8px;">
        <button class="btn btn-primary" id="searchBtn">Buscar</button>
      </div>
      <button class="btn btn-internet" id="internetBtn" style="margin-bottom:8px;">Buscar en Internet</button>
    </div>

    <div class="filter-section">
      <div class="filter-section-title">Portales externos</div>
      <div class="portal-links" id="portalLinks"></div>
    </div>
  </div>

  <!-- Center: Results / Stats -->
  <div class="center-panel" id="centerPanel">
    <div id="resultsView">
      <div class="results-header">
        <div class="results-count" id="resultsCount"></div>
        <div class="client-filter-row" id="clientFilters"></div>
      </div>
      <div id="localSection"></div>
      <div id="internetSection"></div>
      <div id="grid" class="grid"></div>
    </div>
    <div class="stats-panel" id="statsPanel">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="stat-section-title">Palabras más buscadas</div>
      <div id="keywordChart"></div>
      <div class="stat-section-title" style="margin-top:22px;">Guardados por estado</div>
      <div id="statusChart"></div>
    </div>
  </div>

  <!-- Right Sidebar: Saved -->
  <div class="sidebar-right" id="sidebarRight">
    <div class="saved-header">
      <span class="saved-title">Guardados</span>
      <span class="saved-count" id="savedCount">0</span>
    </div>
    <div class="view-toggle" id="savedViewToggle">
      <button class="active" onclick="setSavedView('list')">Lista</button>
      <button onclick="setSavedView('kanban')">Kanban</button>
    </div>
    <div class="bulk-row" id="bulkRow">
      <label><input type="checkbox" id="selectAllSaved"> Todos</label>
      <button onclick="bulkDelete()">Eliminar</button>
      <button onclick="bulkExport()">Exportar</button>
    </div>
    <div id="savedList"></div>
    <div id="savedKanban" class="kanban" style="display:none;"></div>
  </div>
</div>

<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; };
const fmt = n => '$' + Number(n).toLocaleString('es-MX');

const PROPERTY_ICONS = { casa: '\u{1F3E0}', departamento: '\u{1F3E2}', terreno: '\u{1F33F}', local: '\u{1F3EA}' };
const SOURCE_COLORS = { Inmuebles24: '#c2553a', MercadoLibre: '#c9a227', Vivanuncios: '#3a6b8c', Segundamano: '#4a7c59', 'Facebook Marketplace': '#4a6fa5' };
const SOURCE_ICONS = { Inmuebles24: 'I24', MercadoLibre: 'ML', Vivanuncios: 'VA', Segundamano: 'S2', 'Facebook Marketplace': 'FB' };
const STATUS_LABELS = { saved: 'Guardado', applied: 'Aplicado', interviewing: 'Entrevista', offer: 'Oferta', rejected: 'Rechazado' };
const STATUS_COLORS = { saved: '#8a7b68', applied: '#3a6b8c', interviewing: '#6b5b8a', offer: '#4a7c59', rejected: '#c24a3a' };

const BEDROOM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4v16"/><path d="M2 8h20"/><path d="M22 4v16"/><path d="M6 16a2 2 0 0 0 4 0"/><path d="M14 16a2 2 0 0 0 4 0"/></svg>';
const BATH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16a1 1 0 0 1 1 1v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3a1 1 0 0 1 1-1z"/><path d="M6 12V5a2 2 0 0 1 2-2h3v2.25"/></svg>';
const AREA_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>';

let localListings = [];
let internetListings = [];
let internetPortalLinks = [];
let internetErrors = [];
let neighborhoods = [];
let isSearchingInternet = false;
let savedJobs = [];
let savedView = 'list';
let currentTab = 'results';
let savedSet = new Set();

// ── Filters ──────────────────────────────────────────────────────────────

function getFilters() {
  return {
    keyword: $('#filterKeyword').value.trim(),
    type: $('#filterType').value,
    property: $('#filterProperty').value,
    neighborhood: $('#filterNeighborhood').value,
    bedrooms: $('#filterBedrooms').value,
    minPrice: $('#filterMinPrice').value,
    maxPrice: $('#filterMaxPrice').value,
  };
}

function buildParams() {
  const f = getFilters();
  const params = new URLSearchParams();
  if (f.keyword) params.set('q', f.keyword);
  if (f.type !== 'all') params.set('type', f.type);
  if (f.property !== 'all') params.set('property', f.property);
  if (f.neighborhood !== 'all') params.set('neighborhood', f.neighborhood);
  if (f.bedrooms) params.set('bedrooms', f.bedrooms);
  if (f.minPrice) params.set('minPrice', f.minPrice);
  if (f.maxPrice) params.set('maxPrice', f.maxPrice);
  return params;
}

function highlight(text, keyword) {
  if (!keyword) return esc(text);
  const escaped = esc(text);
  const re = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

// ── Sort ──────────────────────────────────────────────────────────────────

function applySort(listings) {
  const sort = $('#sortSelect').value;
  const arr = [...listings];
  switch (sort) {
    case 'price-asc': return arr.sort((a, b) => a.price - b.price);
    case 'price-desc': return arr.sort((a, b) => b.price - a.price);
    case 'area-desc': return arr.sort((a, b) => b.area - a.area);
    case 'title-asc': return arr.sort((a, b) => a.title.localeCompare(b.title));
    default: return arr;
  }
}

// ── API ───────────────────────────────────────────────────────────────────

async function loadListings() {
  const params = buildParams();
  const res = await fetch(`/api/listings?${params}`);
  const data = await res.json();
  localListings = data.listings;
  if (!neighborhoods.length) {
    neighborhoods = data.neighborhoods;
    const sel = $('#filterNeighborhood');
    data.neighborhoods.forEach(n => { const opt = document.createElement('option'); opt.value = n; opt.textContent = n; sel.appendChild(opt); });
  }
  renderPortals(data.portals);
  renderAll();
  updateResultsCount();
}

async function searchInternet() {
  if (isSearchingInternet) return;
  isSearchingInternet = true;
  const btn = $('#internetBtn');
  btn.disabled = true;
  btn.textContent = 'Buscando...';
  const f = getFilters();
  const inetParams = new URLSearchParams();
  if (f.type !== 'all') inetParams.set('type', f.type);
  if (f.property !== 'all') inetParams.set('property', f.property);
  if (f.keyword) inetParams.set('q', f.keyword);
  showSkeleton();
  try {
    const res = await fetch(`/api/search-internet?${inetParams}`);
    const data = await res.json();
    internetListings = data.listings || [];
    internetPortalLinks = data.portalLinks || [];
    internetErrors = data.errors || [];
  } catch {
    internetListings = []; internetPortalLinks = []; internetErrors = [];
  }
  isSearchingInternet = false;
  btn.disabled = false;
  btn.textContent = 'Buscar en Internet';
  renderAll();
  updateResultsCount();
}

// ── Saved Jobs ────────────────────────────────────────────────────────────

async function loadSaved() {
  try {
    const res = await fetch('/api/saved');
    const data = await res.json();
    savedJobs = data.saved || [];
    savedSet = new Set(savedJobs.map(j => j.listing_id));
    renderSaved();
    updateResultsCount();
  } catch { savedJobs = []; savedSet = new Set(); }
}

async function saveJob(listing) {
  const payload = {
    listing_id: String(listing.id), title: listing.title, type: listing.type,
    property: listing.property, price: listing.price, currency: listing.currency || 'MXN',
    bedrooms: listing.bedrooms, bathrooms: listing.bathrooms, area: listing.area,
    neighborhood: listing.neighborhood, address: listing.address, description: listing.description,
    features: listing.features || [], contact: listing.contact, phone: listing.phone,
    source: listing.source || '', sourceUrl: listing.sourceUrl || '',
    image: (listing.image && listing.image.startsWith('http')) ? listing.image : '',
  };
  try {
    await fetch('/api/saved', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    await loadSaved();
  } catch (e) { console.error('[SaveJob]', e); }
}

async function removeSavedJob(id) {
  try { await fetch(`/api/saved/remove?id=${id}`, { method: 'POST' }); await loadSaved(); } catch (e) { console.error('[RemoveJob]', e); }
}

async function updateSavedStatus(id, status) {
  try { await fetch('/api/saved/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status }) }); await loadSaved(); } catch (e) { console.error('[UpdateStatus]', e); }
}

async function updateSavedNotes(id, notes) {
  try { await fetch('/api/saved/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, notes }) }); } catch (e) { console.error('[UpdateNotes]', e); }
}

function isJobSaved(listingId) { return savedSet.has(String(listingId)); }

function toggleSave(listing, e) {
  if (e) e.stopPropagation();
  if (isJobSaved(listing.id)) {
    const saved = savedJobs.find(j => j.listing_id === String(listing.id));
    if (saved) removeSavedJob(saved.id);
  } else { saveJob(listing); }
}

// ── Bulk ──────────────────────────────────────────────────────────────────

async function bulkDelete() {
  const checked = document.querySelectorAll('.saved-check:checked');
  const ids = [...checked].map(c => Number(c.value));
  if (!ids.length) return;
  if (!confirm(`Eliminar ${ids.length} inmuebles guardados?`)) return;
  try { await fetch('/api/saved/bulk-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) }); await loadSaved(); } catch (e) { console.error('[BulkDelete]', e); }
}

function bulkExport() {
  const checked = document.querySelectorAll('.saved-check:checked');
  const ids = new Set([...checked].map(c => c.value));
  const toExport = ids.size ? savedJobs.filter(j => ids.has(String(j.id))) : savedJobs;
  if (!toExport.length) return;
  const csv = ['listing_id,title,type,property,price,neighborhood,status,notes'];
  toExport.forEach(j => { csv.push(`"${j.listing_id}","${j.title}","${j.type}","${j.property}",${j.price},"${j.neighborhood}","${j.status}","${(j.notes||'').replace(/"/g,'""')}"`); });
  const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zamora-homes-guardados-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── Render ────────────────────────────────────────────────────────────────

function updateResultsCount() {
  const f = getFilters();
  const localCount = localListings.length;
  const inetCount = internetListings.length;
  const savedCount = savedJobs.length;
  $('#resultsCount').innerHTML = `<strong>${localCount}</strong> locales` + (inetCount ? ` + <strong style="color:var(--green)">${inetCount}</strong> internet` : '');
  $('#headerStats').textContent = `${localCount + inetCount} resultados · ${savedCount} guardados`;
  $('#savedCount').textContent = savedCount;
}

function renderPortals(portals) {
  $('#portalLinks').innerHTML = portals.map(p => {
    const color = SOURCE_COLORS[p.name] || '#8a7b68';
    const icon = p.icon || SOURCE_ICONS[p.name] || p.name.slice(0,2).toUpperCase();
    return `<a class="portal-link" href="${p.url}" target="_blank" rel="noopener">
      <span class="portal-icon" style="background:${color}">${esc(icon)}</span>
      ${esc(p.name)}
    </a>`;
  }).join('');
}

function showSkeleton() {
  let html = '';
  for (let i = 0; i < 5; i++) {
    html += `<div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line med"></div><div class="skeleton-line short"></div></div></div>`;
  }
  $('#grid').innerHTML = html;
}

function renderAll() {
  let html = '';
  const keyword = getFilters().keyword;

  if (localListings.length) {
    const localCards = renderCards(applySort(localListings), false, keyword);
    $('#localSection').innerHTML = `<div class="section-divider">Locales <span class="count">${localListings.length}</span></div>`;
    html += localCards;
  } else { $('#localSection').innerHTML = ''; }

  if (internetListings.length) {
    const inetCards = renderCards(applySort(internetListings), true, keyword);
    $('#internetSection').innerHTML = `<div class="section-divider">De Internet <span class="count">${internetListings.length}</span></div>`;
    html += inetCards;
  } else if (isSearchingInternet) {
    showSkeleton(); return;
  } else if (internetPortalLinks.length) {
    const linksHtml = internetPortalLinks.map(p => {
      const color = SOURCE_COLORS[p.name] || '#8a7b68';
      const icon = SOURCE_ICONS[p.name] || p.name.slice(0,2).toUpperCase();
      const err = internetErrors.find(e => e.source === p.name);
      return `<a class="portal-link" href="${esc(p.url)}" target="_blank" rel="noopener" style="padding:14px;justify-content:center;">
        <span class="portal-icon" style="background:${color}">${esc(icon)}</span>
        <div style="flex:1"><div style="font-weight:700;font-size:0.82rem">${esc(p.name)}</div><div style="font-size:0.66rem;color:var(--text2);margin-top:2px">${err ? 'Bloqueado — abrir en portal' : 'Abrir búsqueda'} &rarr;</div></div>
        <span style="font-size:1rem;color:var(--copper)">&rarr;</span>
      </a>`;
    }).join('');
    const errorsNote = internetErrors.length ? `<div style="font-size:0.72rem;color:var(--text2);margin-top:8px;font-style:italic">Los portales bloquean la lectura automática. Haz clic para ver directamente.</div>` : '';
    $('#internetSection').innerHTML = `<div class="section-divider">Resultados de Internet</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">${linksHtml}</div>${errorsNote}`;
  } else { $('#internetSection').innerHTML = ''; }

  if (!localListings.length && !internetListings.length) {
    html = '<div class="empty"><div class="empty-icon">\u{1F50D}</div><div style="font-family:var(--serif);font-size:1.1rem;margin-bottom:4px">Sin resultados</div><div style="font-size:0.82rem">Prueba "Buscar en Internet" o amplía los filtros.</div></div>';
  }

  $('#grid').innerHTML = html;
}

function renderCards(listings, isOnline, keyword) {
  return listings.map(l => {
    const hasImage = l.image && l.image.startsWith('http');
    const sourceColor = SOURCE_COLORS[l.source] || 'var(--purple)';
    const sourceChip = isOnline && l.source ? `<span class="card-source-chip" style="background:${sourceColor}">${esc(SOURCE_ICONS[l.source] || l.source)}</span>` : '';
    const linkBtn = isOnline && l.sourceUrl ? `<a class="card-link" href="${esc(l.sourceUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Ver en ${esc(l.source)}</a>` : '';
    const saved = isJobSaved(l.id);
    const saveBtn = `<button class="save-btn ${saved ? 'saved' : ''}" onclick="toggleSave(${JSON.stringify(l).replace(/"/g, '&quot;')}, event)" title="${saved ? 'Quitar de guardados' : 'Guardar'}">${saved ? '★' : '☆'}</button>`;

    return `
    <div class="card" onclick="openModal('${esc(l.id)}')" style="${isOnline ? 'border-left:3px solid '+sourceColor : ''}">
      <div class="card-image">
        ${hasImage ? `<img src="${esc(l.image)}" alt="${esc(l.title)}" loading="lazy">` : `<span class="card-image-placeholder">${PROPERTY_ICONS[l.property] || '\u{1F3E0}'}</span>`}
        <span class="card-tag ${l.type === 'venta' ? 'tag-venta' : 'tag-renta'}">${l.type === 'venta' ? 'VENTA' : 'RENTA'}</span>
        ${sourceChip}
      </div>
      <div class="card-body">
        <div class="card-price">${fmt(l.price)} ${l.type === 'renta' ? '/ mes' : ''}</div>
        <div class="card-title">${highlight(l.title, keyword)}</div>
        <div class="card-location">${highlight(l.neighborhood, keyword)}${l.address ? ' — ' + highlight(l.address, keyword) : ''}</div>
        <div class="card-features">
          ${l.bedrooms > 0 ? `<span class="feature">${BEDROOM_SVG} ${l.bedrooms} rec</span>` : ''}
          ${l.bathrooms > 0 ? `<span class="feature">${BATH_SVG} ${l.bathrooms} baño${l.bathrooms > 1 ? 's' : ''}</span>` : ''}
          ${l.area > 0 ? `<span class="feature">${AREA_SVG} ${l.area} m²</span>` : ''}
        </div>
        <div class="card-desc">${highlight(l.description, keyword)}</div>
      </div>
      <div class="card-footer">
        <div class="card-contact">
          ${l.contact ? `<div class="card-contact-name">${esc(l.contact)}</div>` : ''}
          ${l.phone ? `<div class="card-contact-phone">${esc(l.phone)}</div>` : ''}
        </div>
        <div class="card-actions">
          ${linkBtn}
          ${saveBtn}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Saved Render ──────────────────────────────────────────────────────────

function renderSaved() {
  $('#savedCount').textContent = savedJobs.length;
  if (savedView === 'list') {
    renderSavedList();
    $('#savedList').style.display = '';
    $('#savedKanban').style.display = 'none';
  } else {
    renderSavedKanban();
    $('#savedList').style.display = 'none';
    $('#savedKanban').style.display = 'flex';
  }
}

function renderSavedList() {
  if (!savedJobs.length) {
    $('#savedList').innerHTML = '<div class="empty" style="padding:30px 10px"><div class="empty-icon" style="font-size:1.5rem">\u{1F4C1}</div><div style="font-family:var(--serif)">Sin guardados</div></div>';
    return;
  }
  $('#savedList').innerHTML = savedJobs.map(j => {
    const statusColor = STATUS_COLORS[j.status] || '#8a7b68';
    const statusOpts = Object.entries(STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${j.status === k ? 'selected' : ''}>${v}</option>`).join('');
    return `
    <div class="saved-card">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <div style="flex:1;min-width:0">
          <div class="saved-card-price">${fmt(j.price)} ${j.type === 'renta' ? '/ mes' : ''}</div>
          <div class="saved-card-title">${esc(j.title)}</div>
          <div class="saved-card-source">${esc(j.neighborhood)}${j.source ? ' · ' + esc(j.source) : ''}</div>
        </div>
        <input type="checkbox" class="saved-check" value="${j.id}" style="margin-left:8px;margin-top:4px;accent-color:var(--copper);">
      </div>
      <div class="saved-card-status">
        <span class="status-dot" style="background:${statusColor}"></span>
        <select onchange="updateSavedStatus(${j.id}, this.value)">${statusOpts}</select>
      </div>
      <div class="saved-card-actions">
        ${j.source_url ? `<a href="${esc(j.source_url)}" target="_blank" rel="noopener" style="font-size:0.72rem;color:var(--purple)">Ver original &rarr;</a>` : ''}
        <button onclick="removeSavedJob(${j.id})" title="Eliminar">\u{1F5D1}</button>
      </div>
      <div class="saved-notes-toggle" onclick="toggleNotesRow(${j.id})">${j.notes ? 'Ver nota' : '+ Agregar nota'}</div>
      <div class="saved-notes-area" id="notes-${j.id}" style="display:none">
        <textarea onblur="debounceNotes(${j.id}, this.value)" placeholder="Escribe tus notas...">${esc(j.notes || '')}</textarea>
      </div>
    </div>`;
  }).join('');
}

function renderSavedKanban() {
  const cols = Object.entries(STATUS_LABELS);
  $('#savedKanban').innerHTML = cols.map(([key, label]) => {
    const color = STATUS_COLORS[key];
    const items = savedJobs.filter(j => j.status === key);
    return `<div class="kanban-col">
      <div class="kanban-col-header" style="background:${color}">${label} (${items.length})</div>
      ${items.map(j => `<div class="kanban-card" onclick="openSavedModal(${j.id})"><div class="kanban-card-title">${esc(j.title)}</div><div class="kanban-card-price">${fmt(j.price)}</div></div>`).join('')}
      ${!items.length ? '<div style="font-size:0.66rem;color:var(--text2);text-align:center;padding:12px;font-style:italic">Vacío</div>' : ''}
    </div>`;
  }).join('');
}

function setSavedView(view) {
  savedView = view;
  document.querySelectorAll('#savedViewToggle button').forEach(b => b.classList.remove('active'));
  document.querySelector(`#savedViewToggle button:nth-child(${view === 'list' ? 1 : 2})`).classList.add('active');
  renderSaved();
}

function toggleNotesRow(id) {
  const el = document.getElementById(`notes-${id}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

const notesDebounce = {};
function debounceNotes(id, value) {
  clearTimeout(notesDebounce[id]);
  notesDebounce[id] = setTimeout(() => updateSavedNotes(id, value), 500);
}

// ── Modal ─────────────────────────────────────────────────────────────────

function openModal(id) {
  const allListings = [...localListings, ...internetListings];
  const l = allListings.find(x => String(x.id) === String(id));
  if (!l) return;
  showListingModal(l, !!l.source);
}

function openSavedModal(id) {
  const j = savedJobs.find(x => x.id === id);
  if (!j) return;
  showListingModal({
    id: j.listing_id, title: j.title, type: j.type, property: j.property,
    price: j.price, currency: j.currency, bedrooms: j.bedrooms, bathrooms: j.bathrooms,
    area: j.area, neighborhood: j.neighborhood, address: j.address,
    description: j.description, features: j.features || [], contact: j.contact,
    phone: j.phone, source: j.source, sourceUrl: j.source_url, image: j.image
  }, !!j.source);
}

function showListingModal(l, isOnline) {
  const hasImage = l.image && l.image.startsWith('http');
  const saved = isJobSaved(l.id);
  const sourceColor = SOURCE_COLORS[l.source] || 'var(--purple)';
  $('#modal').style.display = 'flex';
  $('#modal').innerHTML = `
  <div class="modal">
    <div class="modal-header">
      <h2>${esc(l.title)}</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="save-btn ${saved ? 'saved' : ''}" onclick="toggleSave(${JSON.stringify(l).replace(/"/g, '&quot;')}, event);showListingModal(${JSON.stringify(l).replace(/"/g, '&quot;')},${isOnline})" style="font-size:1.5rem">${saved ? '★' : '☆'}</button>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-image">
        ${hasImage ? `<img src="${esc(l.image)}" alt="${esc(l.title)}">` : `<span class="modal-image-placeholder">${PROPERTY_ICONS[l.property] || '\u{1F3E0}'}</span>`}
      </div>
      <div class="modal-price">${fmt(l.price)} ${l.type === 'renta' ? '/ mes' : ''}</div>
      <div class="modal-meta">
        <span class="card-tag ${l.type === 'venta' ? 'tag-venta' : 'tag-renta'}" style="border:none">${l.type === 'venta' ? 'VENTA' : 'RENTA'}</span>
        ${isOnline ? `<span style="background:${sourceColor};color:#fff;border:none">${esc(l.source)}</span>` : '<span style="border:none">Local</span>'}
        <span>${esc(l.neighborhood)}</span>
        ${l.address ? `<span>${esc(l.address)}</span>` : ''}
        ${l.bedrooms > 0 ? `<span>${l.bedrooms} recámaras</span>` : ''}
        ${l.bathrooms > 0 ? `<span>${l.bathrooms} baños</span>` : ''}
        ${l.area > 0 ? `<span>${l.area} m²</span>` : ''}
      </div>
      <div class="modal-desc">${esc(l.description)}</div>
      <div class="modal-features">
        ${(l.features || []).map(f => `<span class="feature">${esc(f)}</span>`).join('')}
      </div>
      <div class="modal-contact">
        <h3>Contacto</h3>
        <div class="modal-contact-info">
          ${l.contact ? `<div><strong>${esc(l.contact)}</strong></div>` : ''}
          ${l.phone ? `<div>Tel: <a href="tel:${esc(l.phone)}">${esc(l.phone)}</a></div>` : ''}
        </div>
      </div>
      ${isOnline && l.sourceUrl ? `<div class="modal-source-link"><a href="${esc(l.sourceUrl)}" target="_blank" rel="noopener">Ver anuncio original en ${esc(l.source)} &rarr;</a></div>` : ''}
    </div>
  </div>`;
}

function closeModal() { $('#modal').style.display = 'none'; }

// ── Tabs ──────────────────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.header-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'results') {
    $('#tabResults').classList.add('active');
    $('#resultsView').style.display = '';
    $('#statsPanel').classList.remove('active');
  } else if (tab === 'stats') {
    $('#tabStats').classList.add('active');
    $('#resultsView').style.display = 'none';
    $('#statsPanel').classList.add('active');
    loadStats();
  }
}

function toggleSavedPanel() {
  const panel = $('#sidebarRight');
  if (window.innerWidth <= 1100) panel.classList.toggle('mobile-open');
}

// ── Stats ─────────────────────────────────────────────────────────────────

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();
    $('#statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-value">${data.totalSearches || 0}</div><div class="stat-label">Búsquedas</div></div>
    <div class="stat-card"><div class="stat-value">${data.totalSaved || 0}</div><div class="stat-label">Guardados</div></div>
    <div class="stat-card"><div class="stat-value">${data.searchesThisWeek || 0}</div><div class="stat-label">Esta semana</div></div>`;
    const maxKw = Math.max(1, ...(data.topKeywords || []).map(k => k.cnt));
    $('#keywordChart').innerHTML = (data.topKeywords || []).map(k => `
    <div class="mini-bar">
      <span class="mini-bar-label">${esc(k.keyword)}</span>
      <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${(k.cnt/maxKw*100).toFixed(0)}%;background:var(--accent)"></div></div>
      <span style="font-size:0.7rem;color:var(--text2)">${k.cnt}</span>
    </div>`).join('') || '<div style="font-size:0.78rem;color:var(--text2);font-style:italic">Sin datos aún</div>';
    const maxSt = Math.max(1, ...(data.savedByStatus || []).map(s => s.cnt));
    $('#statusChart').innerHTML = (data.savedByStatus || []).map(s => `
    <div class="mini-bar">
      <span class="mini-bar-label">${STATUS_LABELS[s.status] || s.status}</span>
      <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${(s.cnt/maxSt*100).toFixed(0)}%;background:${STATUS_COLORS[s.status] || '#8a7b68'}"></div></div>
      <span style="font-size:0.7rem;color:var(--text2)">${s.cnt}</span>
    </div>`).join('') || '<div style="font-size:0.78rem;color:var(--text2);font-style:italic">Sin datos aún</div>';
  } catch { $('#statsGrid').innerHTML = '<div style="color:var(--text2)">Error cargando estadísticas</div>'; }
}

// ── Search History ────────────────────────────────────────────────────────

async function loadSearchHistory() {
  try { const res = await fetch('/api/history'); const data = await res.json(); const dl = $('#searchHistory'); dl.innerHTML = (data.keywords || []).map(k => `<option value="${esc(k)}">`).join(''); } catch {}
}

// ── Keyboard ──────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'SELECT') {
    e.preventDefault(); $('#filterKeyword').focus();
  }
  if (e.key === 's' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault(); toggleSavedPanel();
  }
});

// ── Events ────────────────────────────────────────────────────────────────

let searchTimeout;
$('#searchBtn').addEventListener('click', loadListings);
$('#internetBtn').addEventListener('click', searchInternet);
$('#filterKeyword').addEventListener('keydown', e => { if (e.key === 'Enter') loadListings(); });
$('#filterKeyword').addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(loadListings, 300); });
$('#filterType').addEventListener('change', loadListings);
$('#filterProperty').addEventListener('change', loadListings);
$('#sortSelect').addEventListener('change', () => renderAll());
$('#selectAllSaved').addEventListener('change', function() { document.querySelectorAll('.saved-check').forEach(c => c.checked = this.checked); });

// ── Init ──────────────────────────────────────────────────────────────────

loadListings();
loadSaved();
loadSearchHistory();
</script>
</body>
</html>
