<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image Generator — Mexico Cultural Flows</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    color: #ddd;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
  }
  h1 { font-size: 18px; color: #888; font-weight: 400; }
  canvas {
    border: 1px solid #333;
    max-width: 100%;
    height: auto;
  }
  #export-btn {
    padding: 10px 28px;
    font-size: 15px;
    background: #2d1b69;
    color: #fff;
    border: 1px solid #4a3a8a;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #export-btn:hover { background: #3d2b89; }
  .info { color: #666; font-size: 13px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<h1>Dev tool — OG Image Generator</h1>
<canvas id="canvas" width="1200" height="630"></canvas>
<button id="export-btn">Export as PNG</button>
<p class="info">1200 x 630px — saves as og-image.png</p>

<script>
const W = 1200;
const H = 630;

const CATEGORIES = [
  { label: 'Gastronomy',    color: '#e85d04' },
  { label: 'Music',         color: '#6a0dad' },
  { label: 'Art',           color: '#c1121f' },
  { label: 'Architecture',  color: '#2d6a4f' },
  { label: 'Traditions',    color: '#9b2226' },
  { label: 'Cinema',        color: '#f5c842' },
];

// Simplified Mexico outline (normalized 0-1, will be scaled to canvas region)
const MEXICO_OUTLINE = [
  [0.12, 0.05], [0.28, 0.02], [0.40, 0.04], [0.52, 0.02],
  [0.62, 0.06], [0.70, 0.10], [0.78, 0.08], [0.85, 0.14],
  [0.90, 0.22], [0.95, 0.30], [0.92, 0.38], [0.88, 0.44],
  [0.82, 0.50], [0.78, 0.56], [0.72, 0.62], [0.68, 0.68],
  [0.62, 0.74], [0.55, 0.78], [0.48, 0.82], [0.42, 0.86],
  [0.36, 0.82], [0.28, 0.76], [0.22, 0.70], [0.16, 0.62],
  [0.10, 0.52], [0.06, 0.42], [0.04, 0.32], [0.06, 0.22],
  [0.08, 0.12], [0.12, 0.05],
];

function draw() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // --- Background gradient ---
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, '#1a0a2e');
  bgGrad.addColorStop(1, '#2d1b69');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle radial glow
  const glow = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.35, 500);
  glow.addColorStop(0, 'rgba(109, 63, 180, 0.18)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // --- Mexico outline (right side, subtle) ---
  const mxCenterX = W * 0.72;
  const mxCenterY = H * 0.42;
  const mxScale = 340;

  ctx.beginPath();
  for (let i = 0; i < MEXICO_OUTLINE.length; i++) {
    const [nx, ny] = MEXICO_OUTLINE[i];
    const px = mxCenterX + (nx - 0.5) * mxScale;
    const py = mxCenterY + (ny - 0.5) * mxScale;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // --- Category dots (scattered across the outline region) ---
  const dotPositions = [
    { x: 0.58, y: 0.30 },
    { x: 0.78, y: 0.22 },
    { x: 0.88, y: 0.38 },
    { x: 0.72, y: 0.58 },
    { x: 0.56, y: 0.70 },
    { x: 0.40, y: 0.52 },
  ];

  CATEGORIES.forEach((cat, i) => {
    const cx = dotPositions[i].x * W;
    const cy = dotPositions[i].y * H;

    // Outer glow
    const dotGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28);
    dotGlow.addColorStop(0, cat.color + '55');
    dotGlow.addColorStop(1, cat.color + '00');
    ctx.fillStyle = dotGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    ctx.fillStyle = cat.color;
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.font = '12px "DM Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(cat.label, cx + 16, cy + 4);
  });

  // --- Title text ---
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 96px "Playfair Display", serif';
  ctx.fillText('Mexico', 72, H * 0.42);

  // --- Subtitle ---
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.font = '400 36px "DM Sans", sans-serif';
  ctx.fillText('Cultural Flows 2026', 76, H * 0.42 + 54);

  // --- Accent line ---
  const lineY = H * 0.42 + 80;
  const lineGrad = ctx.createLinearGradient(72, lineY, 420, lineY);
  lineGrad.addColorStop(0, '#6a0dad');
  lineGrad.addColorStop(0.33, '#e85d04');
  lineGrad.addColorStop(0.66, '#2d6a4f');
  lineGrad.addColorStop(1, '#f5c842');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(72, lineY);
  ctx.lineTo(420, lineY);
  ctx.stroke();

  // --- Fine noise texture overlay ---
  const imageData = ctx.getImageData(0, 0, W, H);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const noise = (Math.random() - 0.5) * 8;
    data[i]     += noise;
    data[i + 1] += noise;
    data[i + 2] += noise;
  }
  ctx.putImageData(imageData, 0, 0);
}

// Wait for fonts then render
document.fonts.ready.then(draw);

// --- Export ---
document.getElementById('export-btn').addEventListener('click', () => {
  const canvas = document.getElementById('canvas');
  const link = document.createElement('a');
  link.download = 'og-image.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>

</body>
</html>
