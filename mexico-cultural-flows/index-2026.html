<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07060f;
  --bg-secondary: #0d0c1a;
  --panel: rgba(15, 12, 28, 0.85);
  --panel-glass: rgba(15, 12, 28, 0.7);
  --border: rgba(255,255,255,0.07);
  --border-faint: rgba(255,255,255,0.04);
  --text: #f0ebe0;
  --text-secondary: rgba(240,235,224,0.7);
  --muted: rgba(240,235,224,0.45);
  --accent-gold: #f5c842;
  --accent-green: #00a86b;
  --accent-red: #c41230;
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);

  --cat-arte: #ec4899;
  --cat-musica: #8b5cf6;
  --cat-gastro: #f97316;
  --cat-danza: #06b6d4;
  --cat-artesania: #22c55e;
  --cat-historia: #eab308;
  --cat-arquitectura: #3b82f6;
  --cat-literatura: #a855f7;
  --cat-film: #ef4444;
  --cat-religion: #d946ef;
  --cat-ciencia: #14b8a6;
  --cat-sport: #f59e0b;
  --cat-fiesta: #dc2626;
  --cat-lengua: #6366f1;
  --cat-ecosistema: #84cc16;

  --era-precolombina: #f59e0b;
  --era-colonia: #8b5cf6;
  --era-independencia: #3b82f6;
  --era-revolucion: #ef4444;
  --era-contemporaneo: #10b981;
}

[data-theme="light"] {
  --bg: #fafaf9;
  --bg-secondary: #f5f5f4;
  --panel: rgba(255,255,255,0.85);
  --panel-glass: rgba(255,255,255,0.7);
  --border: rgba(0,0,0,0.07);
  --border-faint: rgba(0,0,0,0.04);
  --text: #1c1917;
  --text-secondary: rgba(28,25,23,0.7);
  --muted: rgba(28,25,23,0.45);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.skip-link {
  position: absolute; top: -40px; left: 0;
  background: var(--accent-gold); color: #000;
  padding: 8px 16px; z-index: 1000;
  text-decoration: none; font-weight: 600;
  border-radius: 0 0 4px 0; transition: top 0.2s;
}
.skip-link:focus { top: 0; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text); font-size: 16px; line-height: 1.5;
}

#app {
  display: grid;
  grid-template-rows: clamp(56px, 8vh, 72px) 1fr clamp(56px, 12vh, 84px);
  grid-template-columns: clamp(180px, 22vw, 280px) 1fr clamp(240px, 28vw, 360px);
  height: 100vh;
}

/* ── Header ── */
header {
  grid-column: 1 / -1;
  display: flex; align-items: center;
  gap: clamp(12px, 2vw, 22px);
  padding: 0 clamp(16px, 3vw, 32px);
  background: rgba(7,6,15,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
  position: relative; z-index: 10;
}
[data-theme="light"] header { background: rgba(250,250,249,0.95); }

.logo-flag { display: flex; gap: 1px; height: clamp(18px, 2.4vh, 24px); align-items: center; }
.logo-flag span { display: block; width: clamp(5px, 0.8vw, 8px); border-radius: 1px; height: 100%; }
.logo-flag .g { background: var(--accent-green); }
.logo-flag .w { background: #fff; }
.logo-flag .r { background: var(--accent-red); }

.brand { display: flex; flex-direction: column; gap: 2px; }

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1rem, 2.2vw, 1.4rem);
  font-weight: 800; letter-spacing: 0.01em;
  color: var(--text); line-height: 1.2;
}
header h1 span { color: var(--accent-gold); }

.header-sub {
  font-size: clamp(0.65rem, 1.3vw, 0.75rem);
  color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase;
}

.header-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.hdr-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-glass);
  cursor: pointer; font-size: 0.75rem; color: var(--text);
  font-family: 'DM Sans', sans-serif; transition: all 0.2s;
}
.hdr-btn:hover { background: var(--border); }
.hdr-btn:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 2px; }
.hdr-btn.active { border-color: var(--accent-gold); background: rgba(245,200,66,0.1); }

.year-badge {
  background: rgba(245,200,66,0.12); border: 1px solid rgba(245,200,66,0.35);
  border-radius: 20px; padding: 5px 12px;
  font-size: 0.75rem; font-weight: 600;
  color: var(--accent-gold); letter-spacing: 0.06em;
}

/* ── Sidebar ── */
#sidebar {
  grid-row: 2;
  background: var(--panel); border-right: 1px solid var(--border);
  backdrop-filter: blur(16px);
  padding: clamp(14px, 2vw, 20px);
  overflow-y: auto; display: flex; flex-direction: column;
  gap: clamp(12px, 2vw, 18px);
}

.sidebar-section-title {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--muted); margin-bottom: 10px; font-weight: 600;
}

.category-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1px solid transparent; background: var(--border-faint);
  cursor: pointer; transition: all 0.2s ease; margin-bottom: 4px;
  font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
  color: var(--text); text-align: left;
}
.category-btn:hover { background: var(--border); transform: translateX(4px); }
.category-btn:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: -3px; }
.category-btn.active { background: var(--border); border-color: var(--cat-color); box-shadow: 0 0 0 1px var(--cat-color); }

.cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: var(--cat-color); box-shadow: 0 0 10px var(--cat-color); }
.cat-count { margin-left: auto; font-size: 0.7rem; color: var(--muted); background: var(--border); border-radius: 12px; padding: 2px 8px; font-weight: 500; }

.slider-control { display: flex; flex-direction: column; gap: 6px; }
.slider-label { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); }
.slider-value { color: var(--accent-gold); font-weight: 600; }

input[type="range"] {
  width: 100%; -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 3px; background: var(--border); outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: var(--accent-gold); cursor: pointer;
  box-shadow: 0 0 12px var(--accent-gold); transition: all 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 3px; }

.tabs { display: flex; gap: 0; background: var(--border-faint); border-radius: 10px; padding: 4px; margin-bottom: 12px; }
.tab-btn {
  flex: 1; padding: 8px 12px; border: none; background: transparent;
  color: var(--muted); font-size: 0.75rem; font-weight: 500;
  cursor: pointer; border-radius: 8px; transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--panel); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Map Canvas ── */
#map-wrap {
  grid-row: 2; position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 50% 55%, #1a0e28 0%, #07060f 70%);
}
[data-theme="light"] #map-wrap { background: radial-gradient(ellipse at 50% 55%, #e8e4f0 0%, #fafaf9 70%); }

canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
canvas#map:active { cursor: grabbing; }

/* ── Detail Panel ── */
#detail {
  grid-row: 2;
  background: var(--panel); border-left: 1px solid var(--border);
  backdrop-filter: blur(16px);
  padding: clamp(14px, 2vw, 20px);
  overflow-y: auto; display: flex; flex-direction: column;
  gap: clamp(10px, 2vw, 16px);
}

.detail-empty {
  text-align: center; color: var(--muted); font-size: 0.85rem;
  padding-top: clamp(40px, 8vh, 80px); line-height: 1.7;
}
.detail-empty .hint-icon { font-size: clamp(2rem, 4vw, 3rem); display: block; margin-bottom: 16px; opacity: 0.4; }

.city-header { border-bottom: 1px solid var(--border); padding-bottom: 14px; }
.city-header h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 800; line-height: 1.2; }

.region-tag {
  display: inline-block; margin-top: 8px;
  font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px; border: 1px solid; font-weight: 600;
}

.detail-section h4 {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); margin-bottom: 12px; font-weight: 600;
}

.era-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 0.65rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; margin-right: 8px;
}
.era-badge.precolombina { background: rgba(245,158,11,0.15); color: var(--era-precolombina); }
.era-badge.colonia { background: rgba(139,92,246,0.15); color: var(--era-colonia); }
.era-badge.independencia { background: rgba(59,130,246,0.15); color: var(--era-independencia); }
.era-badge.revolucion { background: rgba(239,68,68,0.15); color: var(--era-revolucion); }
.era-badge.contemporanea { background: rgba(16,185,129,0.15); color: var(--era-contemporaneo); }

.flow-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px; border-radius: 12px;
  background: var(--border-faint); border: 1px solid var(--border);
  margin-bottom: 8px; cursor: pointer; transition: all 0.2s ease;
}
.flow-item:hover { background: var(--border); transform: translateX(4px); border-color: var(--cat-color); }
.flow-item:focus-within { outline: 3px solid var(--accent-gold); outline-offset: 3px; }
.flow-icon { font-size: 1.4rem; flex-shrink: 0; }
.flow-content { flex: 1; min-width: 0; }
.flow-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 3px; }
.flow-desc {
  font-size: 0.75rem; color: var(--text-secondary); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.flow-arrow { font-size: 0.7rem; color: var(--muted); margin-top: 6px; font-weight: 500; }

.stat-row { display: flex; gap: 10px; }
.stat-card {
  flex: 1; background: var(--border-faint); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; text-align: center; transition: all 0.2s;
}
.stat-card:hover { background: var(--border); transform: translateY(-2px); }
.stat-val { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.stat-label { font-size: 0.65rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

/* ── Timeline ── */
#timeline {
  grid-column: 1 / -1;
  background: rgba(7,6,15,0.98); border-top: 1px solid var(--border);
  backdrop-filter: blur(16px);
  display: flex; align-items: center;
  gap: clamp(10px, 2vw, 20px);
  padding: 0 clamp(16px, 3vw, 32px);
}
[data-theme="light"] #timeline { background: rgba(250,250,249,0.98); }

.era-markers { display: flex; gap: 4px; flex-shrink: 0; }
.era-marker {
  padding: 4px 10px; border-radius: 20px;
  font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; cursor: pointer; border: 1px solid transparent;
  transition: all 0.2s;
}
.era-marker:hover { border-color: currentColor; }
.era-marker.active { border-color: currentColor; box-shadow: 0 0 10px currentColor; }

#year-slider { flex: 1; }
.tl-year-display { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 800; color: var(--accent-gold); min-width: 50px; }
#play-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--panel-glass);
  color: var(--text); cursor: pointer; font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
#play-btn:hover { background: var(--accent-gold); color: #000; }
#play-btn:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 2px; }

/* ── Modal / Overlay Base ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 100; backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 16px; padding: clamp(20px, 4vw, 32px);
  max-width: clamp(340px, 80vw, 600px); width: 100%;
  max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; font-weight: 800; margin-bottom: 16px;
}
.modal-close {
  float: right; background: none; border: none;
  color: var(--muted); cursor: pointer; font-size: 1.2rem;
  padding: 4px;
}
.modal-close:hover { color: var(--text); }

/* ── Search Overlay ── */
#search-overlay .search-input {
  width: 100%; padding: 14px 18px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text); font-size: 1rem;
  font-family: 'DM Sans', sans-serif; outline: none;
}
#search-overlay .search-input:focus { border-color: var(--accent-gold); }
.search-results { margin-top: 14px; }
.search-result-item {
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  transition: all 0.15s; margin-bottom: 4px;
}
.search-result-item:hover,
.search-result-item.selected { background: var(--border); }
.search-result-item.selected { border-left: 3px solid var(--accent-gold); }
.search-match { font-weight: 700; color: var(--accent-gold); }
.search-result-type { font-size: 0.75rem; margin-right: 8px; }
.search-result-subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.search-no-results { padding: 16px; text-align: center; color: var(--muted); font-size: 0.85rem; }
.search-hint { font-size: 0.7rem; color: var(--muted); margin-top: 8px; text-align: center; }

/* ── QuIZ Modal ── */
.quiz-option {
  display: block; width: 100%; padding: 12px 16px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--border-faint); cursor: pointer;
  text-align: left; color: var(--text); font-size: 0.85rem;
  margin-bottom: 8px; transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.quiz-option:hover { background: var(--border); transform: translateX(4px); }
.quiz-option.selected { border-color: var(--accent-gold); background: rgba(245,200,66,0.1); }

.quiz-progress { display: flex; gap: 6px; margin-bottom: 16px; }
.quiz-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--border); transition: all 0.2s;
}
.quiz-dot.done { background: var(--accent-green); }
.quiz-dot.current { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); }

/* ── Badge Toast ── */
#badge-toast {
  position: fixed; bottom: 100px; right: 24px;
  background: var(--bg-secondary); border: 1px solid var(--accent-gold);
  border-radius: 12px; padding: 14px 20px;
  display: none; z-index: 90; box-shadow: 0 4px 24px rgba(245,200,66,0.3);
  animation: toast-in 0.4s ease-out;
}
#badge-toast.show { display: flex; align-items: center; gap: 12px; }

/* ── Badge Progress ── */
.badge-progress-wrap { margin-bottom: 14px; }
.badge-progress-text { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 6px; }
.badge-progress-text span:first-child { color: var(--text); font-weight: 600; }
.badge-progress-text span:last-child { color: var(--muted); }
.badge-progress-bar { width: 100%; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.badge-progress-fill { height: 100%; border-radius: 3px; background: var(--accent-gold); transition: width 0.4s ease; }

@keyframes toast-in {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.badge-icon { font-size: 2rem; }
.badge-name { font-weight: 600; font-size: 0.85rem; color: var(--accent-gold); }
.badge-desc { font-size: 0.7rem; color: var(--muted); }

/* ── Share Card ── */
.share-card-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-glass);
  cursor: pointer; color: var(--text); font-size: 0.75rem;
  font-family: 'DM Sans', sans-serif; transition: all 0.2s;
}
.share-card-btn:hover { background: var(--accent-gold); color: #000; }

/* ── Compare Mode ── */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare-col h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; }

/* ── Responsive ── */
@media (max-width: 900px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 56px 1fr auto 70px;
  }
  #sidebar { display: none; }
  #sidebar.mobile-open { display: flex; position: fixed; inset: 56px 0 70px 0; z-index: 50; }
  #detail { grid-row: auto; max-height: 35vh; }
  #map-wrap { grid-row: 2; }
  #timeline { grid-column: 1; }
}

/* ── Tablet (768px) responsive refinements ── */
@media (max-width: 768px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 56px 1fr auto 70px;
  }

  header { padding: 0 12px; gap: 8px; }

  .header-sub { font-size: 0.6rem; }

  #sidebar { display: none; }

  #detail {
    grid-row: auto;
    max-height: 40vh;
    padding: 12px;
  }
  .city-header h2 { font-size: 1.1rem; }
  .stat-val { font-size: 1.3rem; }

  #timeline {
    grid-column: 1;
    padding: 0 12px;
    gap: 8px;
  }
  .era-markers { gap: 2px; }
  .era-marker { padding: 3px 7px; font-size: 0.55rem; }
  .tl-year-display { font-size: 0.9rem; min-width: 40px; }
}

/* ── Small mobile (480px) ── */
@media (max-width: 480px) {
  html, body { font-size: 14px; }

  header { padding: 0 10px; gap: 6px; }
  header h1 { font-size: 0.85rem; }
  .header-sub { display: none; }
  .year-badge { padding: 4px 8px; font-size: 0.65rem; }

  .hdr-btn { padding: 4px 6px; font-size: 0.65rem; gap: 2px; }

function startQuiz() {
  quizEngine = new QuizEngine();

  document.getElementById('quiz-overlay').classList.add('active');
  renderQuizStep();

function renderQuizStep() {
  const progress = quizEngine.getProgress();
  if (progress.current >= progress.total) {
    showQuizResults();
    return;
  }
  const question = quizEngine.getCurrentQuestion();

  // Build progress dots using DOM (no innerHTML)
  const progressEl = document.getElementById('quiz-progress');
  progressEl.textContent = '';
  for (let i = 0; i < progress.total; i++) {
    const dot = document.createElement('div');
    dot.className = 'quiz-dot';
    if (i < progress.current) dot.classList.add('done');
    else if (i === progress.current) dot.classList.add('current');
    progressEl.appendChild(dot);
  }

  // Build question text using DOM
  const questionEl = document.getElementById('quiz-question');
  questionEl.textContent = '';
  const qP = document.createElement('p');
  qP.style.cssText = 'font-size:0.95rem;font-weight:600;margin-bottom:12px';
  qP.textContent = question.question;
  questionEl.appendChild(qP);

  // Build option buttons using DOM
  const optionsEl = document.getElementById('quiz-options');
  optionsEl.textContent = '';
  question.options.forEach(function(opt, i) {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.setAttribute('data-idx', String(i));
    btn.textContent = opt.text;
    btn.addEventListener('click', function() {
      const result = quizEngine.selectOption(i);
      quizAnswers.push({ questionId: question.id, optionIndex: i });
      playerState.quizAnswers[progress.current] = i;
      if (result === 'next') {
        renderQuizStep();
      } else if (result === 'complete') {
        showQuizResults();
      }
    });
    optionsEl.appendChild(btn);
  });

  // Add back button if not on first question
  if (progress.current > 0) {
    const backBtn = document.createElement('button');
    backBtn.className = 'quiz-option';
    backBtn.style.cssText = 'margin-top:12px;color:var(--muted)';
    backBtn.textContent = '← Back';
    backBtn.addEventListener('click', function() {
      quizEngine.currentQuestion = Math.max(0, quizEngine.currentQuestion - 1);
      if (quizAnswers.length > 0) quizAnswers.pop();
      renderQuizStep();
    });
    optionsEl.appendChild(backBtn);
  }
}

const canvas = document.getElementById('map');

let W, H;

let particleSpeed = 1.0;
let flowIntensity = 0.65;

const GEO = { lonMin:-118, lonMax:-86, latMin:14, latMax:34 };
function geoToScreen(lon, lat) {
  const pad = { left:0.06, right:0.04, top:0.04, bottom:0.06 };
  const mapW = W * (1 - pad.left - pad.right);
  const mapH = H * (1 - pad.top - pad.bottom);
  const x = W * pad.left + ((lon - GEO.lonMin) / (GEO.lonMax - GEO.lonMin)) * mapW;
  const y = H * pad.top + ((GEO.latMax - lat) / (GEO.latMax - GEO.latMin)) * mapH;
  return { x, y };
}

const MEXICO_OUTLINE = [
  [-117.1,32.5],[-115.5,32.6],[-114,32.4],[-111,31.3],[-108,31.5],
  [-106,31.8],[-104.9,30.6],[-103.5,29.5],[-101.5,29.7],[-100.1,28.2],
  [-99.5,26.5],[-97.5,26],[-97.1,23.7],[-97.5,22.5],[-97.7,20.8],
  [-96.7,19.3],[-94.7,18.2],[-92.3,18.5],[-91.5,18.8],[-90,18],
  [-89.2,17.7],[-88,16],[-87.5,15.9],[-88.5,15.7],[-89.2,15.6],

  [-96.3,15.7],[-97.8,16.1],[-99,16.3],[-101.7,17.2],[-103.5,18.7],

  [-109.5,23.6],[-110,24.2],[-110.5,26],[-109.5,27.5],[-110.5,28.5],
  [-111.7,29.5],[-113.1,30.1],[-114.7,32],[-117.1,32.5]
];

class Particle {
  constructor(sx,sy,ex,ey,cat) {
    this.sx=sx; this.sy=sy; this.ex=ex; this.ey=ey;
    this.cat=cat; this.color=CAT_COLORS[cat];
    this.t=Math.random();
    this.speed=(0.0015+Math.random()*0.002)*particleSpeed;
    this.size=2.5+Math.random()*2; this.alpha=0.5+Math.random()*0.5;
  }
  update() { this.t += this.speed; if (this.t > 1) this.t = 0; }
  position() {
    const t = this.t;
    const cx1 = this.sx+(this.ex-this.sx)*0.25-(this.ey-this.sy)*0.35;
    const cy1 = this.sy+(this.ey-this.sy)*0.25+(this.ex-this.sx)*0.35;
    const cx2 = this.sx+(this.ex-this.sx)*0.75-(this.ey-this.sy)*0.35;
    const cy2 = this.sy+(this.ey-this.sy)*0.75+(this.ex-this.sx)*0.35;
    const mt = 1 - t;
    return {
      x: mt*mt*mt*this.sx + 3*mt*mt*t*cx1 + 3*mt*t*t*cx2 + t*t*t*this.ex,
      y: mt*mt*mt*this.sy + 3*mt*mt*t*cy1 + 3*mt*t*t*cy2 + t*t*t*this.ey
    };
  }
  draw() {
    const {x,y} = this.position();
    const fade = Math.sin(this.t * Math.PI);
    ctx.beginPath(); ctx.arc(x, y, this.size, 0, Math.PI*2);
    ctx.fillStyle = hexAlpha(this.color, fade * this.alpha * flowIntensity);
    ctx.fill();
  }
}

let particles = [];

function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,a))})`;
}
function buildParticles() {
  particles = [];
  const cityMap = {};
  CITIES.forEach(c => { cityMap[c.id] = geoToScreen(c.lon, c.lat); });
  FLOWS.forEach(flow => {
    if (!activeCategories.has(flow.cat)) return;
    if (currentYear < 1521 && flow.cat === 'film') return; // era filters
    const s = cityMap[flow.from], e = cityMap[flow.to];
    if (!s || !e) return;
    const count = Math.max(1, Math.floor(4 * flowIntensity));
    for (let i = 0; i < count; i++) particles.push(new Particle(s.x, s.y, e.x, e.y, flow.cat));
  });
}

function resize() {
  W = canvas.offsetWidth; H = canvas.offsetHeight;
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  buildParticles();
}

function drawMexicoSilhouette() {
  ctx.beginPath();
  MEXICO_OUTLINE.forEach(([lon,lat],i) => {
    const {x,y} = geoToScreen(lon, lat);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  const grd = ctx.createLinearGradient(0,0,W,H);
  grd.addColorStop(0, 'rgba(196,84,42,0.08)');
  grd.addColorStop(0.5, 'rgba(180,60,20,0.12)');
  grd.addColorStop(1, 'rgba(100,30,10,0.07)');
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = 'rgba(196,84,42,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawFlowLines() {
  const cityMap = {};
  CITIES.forEach(c => { cityMap[c.id] = geoToScreen(c.lon, c.lat); });
  FLOWS.forEach(flow => {
    if (!activeCategories.has(flow.cat)) return;
    const isHighlighted = hoveredCity && (flow.from===hoveredCity.id || flow.to===hoveredCity.id);
    const s = cityMap[flow.from], e = cityMap[flow.to];
    if (!s || !e) return;
    const cx1=s.x+(e.x-s.x)*0.25-(e.y-s.y)*0.35, cy1=s.y+(e.y-s.y)*0.25+(e.x-s.x)*0.35;
    const cx2=s.x+(e.x-s.x)*0.75-(e.y-s.y)*0.35, cy2=s.y+(e.y-s.y)*0.75+(e.x-s.x)*0.35;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.bezierCurveTo(cx1,cy1,cx2,cy2,e.x,e.y);
    ctx.strokeStyle = hexAlpha(CAT_COLORS[flow.cat], isHighlighted ? 0.6 : 0.08);
    ctx.lineWidth = isHighlighted ? 1.5 : 0.7; ctx.stroke();
  });
}

function drawCities() {
  CITIES.forEach(city => {
    if (currentYear < city.yearFrom) return;
    const {x,y} = geoToScreen(city.lon, city.lat);
    const isHovered = hoveredCity && hoveredCity.id === city.id;
    const isFiltered = city.categories.some(c => activeCategories.has(c));
    if (!isFiltered) return;
    const activeCats = city.categories.filter(c => activeCategories.has(c));
    const color = CAT_COLORS[activeCats[0]] || '#ffffff';
    const glowSize = isHovered ? 28 : 18;
    const grad = ctx.createRadialGradient(x,y,0,x,y,glowSize);
    grad.addColorStop(0, hexAlpha(color, isHovered ? 0.35 : 0.15));
    grad.addColorStop(1, hexAlpha(color, 0));
    ctx.beginPath(); ctx.arc(x,y,glowSize,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
    const segCount = activeCats.length, segAngle = (Math.PI*2)/segCount;
    activeCats.forEach((cat,i) => {
      ctx.beginPath(); ctx.arc(x,y,isHovered?9:6,i*segAngle-Math.PI/2,(i+1)*segAngle-Math.PI/2);
      ctx.strokeStyle = CAT_COLORS[cat]; ctx.lineWidth = isHovered?2.5:1.8; ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(x,y,isHovered?4.5:3,0,Math.PI*2);
    ctx.fillStyle = isHovered ? '#ffffff' : hexAlpha('#ffffff',0.85); ctx.fill();
    if (isHovered || W > 800) {
      ctx.font = `${isHovered?'600':'400'} ${isHovered?12:10}px "DM Sans",sans-serif`;
      ctx.fillStyle = isHovered ? '#ffffff' : 'rgba(240,235,224,0.6)';
      ctx.textAlign = 'center'; ctx.fillText(city.name, x, y+(isHovered?22:18));
    }
  });
}

let _stars = null;
function drawStars() {
  if (!_stars) _stars = Array.from({length:120}, () => ({ x:Math.random(), y:Math.random(), r:Math.random()*1.2, a:Math.random()*0.4+0.1 }));
  _stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fillStyle=`rgba(255,255,255,${s.a})`; ctx.fill(); });
}

function frame() {
  ctx.clearRect(0,0,W,H);
  drawStars();
  drawMexicoSilhouette();
  drawFlowLines();
  particles.forEach(p => { p.speed = (0.0015+Math.random()*0.002)*particleSpeed; p.update(); p.draw(); });
  drawCities();
  drawConfetti();
 }

 requestAnimationFrame(frame);
}

const confettiCanvas = document.getElementById('confetti-canvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiActive = false;
let confettiStart = 0;
const CONFETTI_DURATION = 2000;
const CONFETTI_COLORS = ['#f5c842','#ec4899','#8b5cf6','#f97316','#22c55e','#06b6d4','#ef4444','#3b82f6','#eab308','#dc2626'];

class ConfettiParticle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 12;
    this.vy = -(Math.random() * 8 + 4);
    this.gravity = 0.18;
    this.size = Math.random() * 6 + 3;
    this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.3;
    this.alpha = 1;
    this.shape = Math.random() > 0.5 ? 'rect' : 'circle';
  }
  update(elapsed) {
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.rotation += this.rotationSpeed;
    this.alpha = Math.max(0, 1 - elapsed / CONFETTI_DURATION);
    this.vx *= 0.99;
  }
  draw(c) {
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.rotation);
    c.globalAlpha = this.alpha;
    c.fillStyle = this.color;
    if (this.shape === 'rect') {
      c.fillRect(-this.size / 2, -this.size / 4, this.size, this.size / 2);
    } else {
      c.beginPath();
      c.arc(0, 0, this.size / 2, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }
}

function launchConfetti() {
  confettiCanvas.width = confettiCanvas.offsetWidth * devicePixelRatio;
  confettiCanvas.height = confettiCanvas.offsetHeight * devicePixelRatio;
  confettiCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const cw = confettiCanvas.offsetWidth;
  const ch = confettiCanvas.offsetHeight;
  confettiParticles = [];
  for (let i = 0; i < 100; i++) {
    confettiParticles.push(new ConfettiParticle(
      cw / 2 + (Math.random() - 0.5) * cw * 0.5,
      ch * 0.5
    ));
  }
  confettiStart = performance.now();
  confettiActive = true;
}

function drawConfetti() {
  if (!confettiActive) return;
  const now = performance.now();
  const elapsed = now - confettiStart;
  if (elapsed > CONFETTI_DURATION) {
    confettiActive = false;
    confettiParticles = [];
    confettiCtx.clearRect(0, 0, confettiCanvas.offsetWidth, confettiCanvas.offsetHeight);
    return;
  }
  const cw = confettiCanvas.offsetWidth;
  const ch = confettiCanvas.offsetHeight;
  confettiCtx.clearRect(0, 0, cw, ch);
  confettiParticles.forEach(p => {
    p.update(elapsed);
    p.draw(confettiCtx);
  });
}

};

function searchCities(query) {
  const q = query.toLowerCase().trim();
  if (!q) return [];
  const results = [];

  CITIES.forEach(city => {
    const cityES = city.name.toLowerCase();
    const cityEN = (CITY_I18N[city.id]?.en || city.name).toLowerCase();
    const cityPT = (CITY_I18N[city.id]?.pt || city.name).toLowerCase();
    const regionLC = city.region.toLowerCase();
    const eraObj = ERAS.find(e => e.id === city.era);
    const eraLC = eraObj ? eraObj.label.toLowerCase() : '';

    if (cityES.includes(q) || cityEN.includes(q) || cityPT.includes(q)) {
      const idx = cityES.indexOf(q);
      results.push({ type:'city', city, match: city.name, score: idx === 0 ? 10 : 5 });
    } else if (regionLC.includes(q)) {
      results.push({ type:'city', city, match: city.region, score: 3 });
    } else if (eraLC.includes(q)) {
      results.push({ type:'city', city, match: eraObj.label, score: 2 });
    }

    city.flows.forEach(flow => {
      const nameLC = flow.name.toLowerCase();
      const descLC = flow.desc.toLowerCase();
      if (nameLC.includes(q)) {
        const idx = nameLC.indexOf(q);
        results.push({ type:'flow', city, flow, match: flow.name, score: idx === 0 ? 9 : 4 });
      } else if (descLC.includes(q)) {
        results.push({ type:'flow', city, flow, match: flow.desc, score: 2 });
      }
    });

    city.categories.forEach(catId => {
      const cat = CATEGORIES.find(c => c.id === catId);
      if (cat && (cat.id.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q))) {
        results.push({ type:'category', city, match: cat.name, score: 3 });
      }
    });
  });

  results.forEach(r => { r.cityName = r.city.name; });
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 30);
}

function highlightMatch(text, query) {
  const q = query.toLowerCase().trim();
  if (!q) return [document.createTextNode(text)];
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return [document.createTextNode(text)];
  const nodes = [];
  if (idx > 0) nodes.push(document.createTextNode(text.slice(0, idx)));
  const mark = document.createElement('span');
  mark.className = 'search-match';
  mark.textContent = text.slice(idx, idx + q.length);
  nodes.push(mark);
  if (idx + q.length < text.length) nodes.push(document.createTextNode(text.slice(idx + q.length)));
  return nodes;
}

let searchSelectedIndex = -1;
let searchResultItems = [];
let searchDebounceTimer = null;

function renderSearchResults(results, query) {
  const container = document.getElementById('search-results');
  container.textContent = '';
  searchResultItems = [];
  searchSelectedIndex = -1;

  if (!results.length && query.trim()) {
    const noRes = document.createElement('div');
    noRes.className = 'search-no-results';
    noRes.textContent = 'No results found';
    container.appendChild(noRes);
    return;
  }

  var typeIcons = { city: '\u{1F3D9}️', flow: '\u{1F30A}', category: '\u{1F3F7}️' };

  results.forEach(function(r, i) {
    var item = document.createElement('div');
    item.className = 'search-result-item';
    item.setAttribute('role', 'option');
    item.dataset.index = i;

    var iconSpan = document.createElement('span');
    iconSpan.className = 'search-result-type';
    iconSpan.textContent = typeIcons[r.type] || '';
    item.appendChild(iconSpan);

    var matchSpan = document.createElement('span');
    var highlighted = highlightMatch(r.match, query);
    highlighted.forEach(function(n) { matchSpan.appendChild(n); });
    item.appendChild(matchSpan);

    var subDiv = document.createElement('div');
    subDiv.className = 'search-result-subtitle';
    subDiv.textContent = r.cityName;
    item.appendChild(subDiv);

    item.addEventListener('click', function() { selectSearchResult(r); });
    container.appendChild(item);
    searchResultItems.push(item);
  });
}

function updateSearchSelection() {
  searchResultItems.forEach(function(el, i) {
    if (i === searchSelectedIndex) {
      el.classList.add('selected');
      el.scrollIntoView({ block: 'nearest' });
    } else {
      el.classList.remove('selected');
    }
  });
}

  selectedCity = result.city;
  document.getElementById('search-overlay').classList.remove('active');
  document.getElementById('search-input').value = '';

}

document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (searchResultItems.length) {
      searchSelectedIndex = Math.min(searchSelectedIndex + 1, searchResultItems.length - 1);
      updateSearchSelection();
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (searchResultItems.length) {
      searchSelectedIndex = Math.max(searchSelectedIndex - 1, 0);
      updateSearchSelection();
    }
  } else if (e.key === 'Enter' && searchSelectedIndex >= 0) {
    e.preventDefault();
    var idx = parseInt(searchResultItems[searchSelectedIndex].dataset.index);
    var results = searchCities(document.getElementById('search-input').value);
    if (results[idx]) selectSearchResult(results[idx]);
  }
});

    eraDiv.textContent = 'Era: ' + city.era;
    col.appendChild(h3);
    col.appendChild(statsDiv);
    col.appendChild(catsDiv);
    col.appendChild(eraDiv);
    return col;
  }
  const grid = document.getElementById('compare-grid');
  grid.textContent = '';
  grid.appendChild(buildCompareCol(a));
  grid.appendChild(buildCompareCol(b));
}

// SHARE CARD (Canvas-based)
// ═══════════════════════════════════════════════════════
function generateShareCard(cityId) {
  return new Promise((resolve, reject) => {
    const city = CITIES.find(c => c.id === cityId);
    if (!city) { reject(new Error('City not found')); return; }

    const era = ERAS.find(e => e.id === city.era);
    const eraColor = era ? era.color : '#f5c842';
    const W = 1200, H = 630;
    const offscreen = document.createElement('canvas');
    offscreen.width = W;
    offscreen.height = H;
    const c = offscreen.getContext('2d');

    // Gradient background
    const bg = c.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#07060f');
    bg.addColorStop(0.5, hexAlpha(eraColor, 0.15));
    bg.addColorStop(1, '#0d0c1a');
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    // Subtle pattern overlay — diagonal lines
    c.strokeStyle = hexAlpha(eraColor, 0.04);
    c.lineWidth = 1;
    for (let i = -H; i < W + H; i += 40) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i + H, H); c.stroke();
    }

    // Accent strip on left
    const stripGrad = c.createLinearGradient(0, 0, 0, H);
    stripGrad.addColorStop(0, eraColor);
    stripGrad.addColorStop(1, hexAlpha(eraColor, 0.4));
    c.fillStyle = stripGrad;
    c.fillRect(0, 0, 8, H);

    // Title — city name
    c.font = '800 72px "Playfair Display", serif';
    c.fillStyle = '#f0ebe0';
    c.textBaseline = 'top';
    c.fillText(city.name, 60, 70);

    // Region + year founded
    c.font = '500 28px "DM Sans", sans-serif';
    c.fillStyle = eraColor;
    c.fillText(`${city.region}  ·  Founded ${city.yearFrom}`, 60, 160);

    // Era badge
    const eraLabel = era ? era.label : city.era;
    c.font = '600 20px "DM Sans", sans-serif';
    const badgeX = 60;
    const badgeY = 210;
    const badgeW = c.measureText(eraLabel).width + 24;
    c.fillStyle = hexAlpha(eraColor, 0.15);
    roundRect(c, badgeX, badgeY, badgeW, 34, 17);
    c.fill();
    c.fillStyle = eraColor;
    c.textBaseline = 'middle';
    c.fillText(eraLabel, badgeX + 12, badgeY + 17);

    // Stats row
    c.textBaseline = 'top';
    const statsY = 270;
    const stats = [
      { val: String(city.stats.cultural_sites), label: 'CULTURAL SITES', color: eraColor },
      { val: String(city.stats.unesco), label: 'UNESCO', color: '#f5c842' },
      { val: String(city.stats.traditions), label: 'TRADITIONS', color: '#00a86b' }
    ];
    stats.forEach((s, i) => {
      const sx = 60 + i * 180;
      c.font = '700 42px "DM Sans", sans-serif';
      c.fillStyle = s.color;
      c.fillText(s.val, sx, statsY);
      c.font = '500 14px "DM Sans", sans-serif';
      c.fillStyle = 'rgba(240,235,224,0.5)';
      c.fillText(s.label, sx, statsY + 52);
    });

    // Horizontal divider
    c.strokeStyle = 'rgba(255,255,255,0.08)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(60, 365); c.lineTo(W - 60, 365); c.stroke();

    // Cultural facts (2-3 from city.flows)
    const facts = city.flows.slice(0, 3);
    facts.forEach((flow, i) => {
      const fy = 390 + i * 52;
      // Category dot
      c.beginPath(); c.arc(76, fy + 12, 6, 0, Math.PI * 2);
      c.fillStyle = CAT_COLORS[flow.cat] || eraColor;
      c.fill();
      // Flow name
      c.font = '600 22px "DM Sans", sans-serif';
      c.fillStyle = CAT_COLORS[flow.cat] || '#f0ebe0';
      c.textBaseline = 'top';
      c.fillText(flow.name, 96, fy);
      // Flow description (truncated to fit)
      c.font = '400 16px "DM Sans", sans-serif';
      c.fillStyle = 'rgba(240,235,224,0.6)';
      const maxDescW = W - 96 - 60;
      const truncated = truncateText(c, flow.desc, maxDescW);
      c.fillText(truncated, 96, fy + 28);
    });

    // Hashtags at bottom
    c.font = '600 22px "DM Sans", sans-serif';
    c.fillStyle = eraColor;
    c.textBaseline = 'bottom';
    c.fillText('#MexicoCulturalFlows  #CulturaMx', 60, H - 36);

    // Branding at bottom-right
    c.font = '400 16px "DM Sans", sans-serif';
    c.fillStyle = 'rgba(240,235,224,0.3)';
    c.textAlign = 'right';
    c.fillText('Culturas de Mexico · Cultural Flows 2026', W - 60, H - 36);
    c.textAlign = 'left';

    // Convert to blob
    offscreen.toBlob(blob => {
      if (!blob) { reject(new Error('Canvas toBlob failed')); return; }
      resolve(blob);
    }, 'image/png');
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function truncateText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 0 && ctx.measureText(t + '...').width > maxW) {
    t = t.slice(0, -1);
  }
  return t + '...';
}

function shareCity(cityId) {
  const city = CITIES.find(c => c.id === cityId);
  if (!city) return;

  generateShareCard(cityId).then(blob => {
    const file = new File([blob], `cultura-${city.id}-share.png`, { type: 'image/png' });
    const shareData = {
      title: city.name,
      text: `${city.name} — ${city.region}, Mexico. ${city.stats.cultural_sites} cultural sites, ${city.stats.unesco} UNESCO sites.`,
      url: window.location.href,
      files: [file]
    };

    if (navigator.canShare && navigator.canShare(shareData)) {
      navigator.share(shareData).catch(() => {
        // User cancelled or share failed — fall back to text-only
        shareTextFallback(city);
      });
    } else if (navigator.share) {
      // Share API exists but doesn't support files — try text-only share
      navigator.share({
        title: city.name,
        text: `${city.name} — ${city.region}, Mexico. ${city.stats.cultural_sites} cultural sites, ${city.stats.unesco} UNESCO sites. #MexicoCulturalFlows #CulturaMx`,
        url: window.location.href
      }).catch(() => {
        // Download the card as fallback
        downloadShareCard(blob, city.id);
      });
    } else {
      // No Share API — download the image
      downloadShareCard(blob, city.id);
    }
  }).catch(() => {
    // Canvas generation failed — text-only fallback
    shareTextFallback(city);
  });
}

function shareTextFallback(city) {
  const text = `${city.name} — ${city.region}, Mexico. ${city.stats.cultural_sites} cultural sites, ${city.stats.unesco} UNESCO sites. #MexicoCulturalFlows #CulturaMx`;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('badge-toast');
    document.getElementById('badge-toast-icon').textContent = '📋';
    document.getElementById('badge-toast-name').textContent = 'Copied!';
    document.getElementById('badge-toast-desc').textContent = 'Share text copied to clipboard';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

function downloadShareCard(blob, cityId) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cultura-${cityId}-share.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  // Also show toast
  const toast = document.getElementById('badge-toast');
  document.getElementById('badge-toast-icon').textContent = '🖼';
  document.getElementById('badge-toast-name').textContent = 'Downloaded!';
  document.getElementById('badge-toast-desc').textContent = 'Share card saved as image';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    var searchOverlay = document.getElementById('search-overlay');
    if (searchOverlay.classList.contains('active')) {
      searchOverlay.classList.remove('active');
    } else {
      openSearchModal();
    }
  }
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    openSearchModal();
  }
});

// ── PDF Export (canvas capture + summary) ──
function exportPDF() {
  var screenshot = canvas.toDataURL('image/png');
  var date = new Date().toLocaleDateString('es-MX', { year:'numeric', month:'long', day:'numeric' });
  var city = selectedCity || hoveredCity;

  var w = window.open('', '_blank');
  if (!w) return;
  var d = w.document;

  d.head.appendChild(Object.assign(d.createElement('meta'), { charset: 'UTF-8' }));
  d.title = 'México Cultural Flows 2026';
  var style = d.createElement('style');
  style.textContent =
    '@page{margin:12mm}body{font-family:DM Sans,system-ui,sans-serif;color:#222;margin:0;padding:20px}' +
    'img.screenshot{width:100%;border:1px solid #ddd;border-radius:8px}' +
    '.pdf-detail{margin-top:16px;padding:12px;border:1px solid #eee;border-radius:8px}' +
    '.pdf-footer{margin-top:20px;padding-top:10px;border-top:1px solid #ccc;font-size:.75rem;color:#999;display:flex;justify-content:space-between}' +
    '.stat-box{display:flex;gap:18px;margin:10px 0}.stat-box>div{text-align:center}';
  d.head.appendChild(style);

  var img = d.createElement('img');
  img.className = 'screenshot';
  img.src = screenshot;
  d.body.appendChild(img);

  if (city) {
    var era = ERAS.find(function(e) { return e.id === city.era; });
    var activeCats = city.categories ? city.categories.filter(function(c) { return activeCategories.has(c); }) : [];
    var color = CAT_COLORS[activeCats[0]] || '#eab308';
    var topFlows = (city.flows || []).filter(function(f) { return activeCategories.has(f.cat); }).slice(0, 5);

    var detail = d.createElement('div');
    detail.className = 'pdf-detail';

    var h2 = d.createElement('h2');
    h2.style.cssText = 'margin:0 0 4px;font-size:1.4rem';
    h2.textContent = city.name;
    detail.appendChild(h2);

    var meta = d.createElement('p');
    meta.style.cssText = 'margin:0 0 2px;color:#888';
    var rB = d.createElement('strong'); rB.textContent = 'Region:';
    meta.appendChild(rB); meta.appendChild(d.createTextNode(' ' + city.region + '  |  '));
    var eB = d.createElement('strong'); eB.textContent = 'Era:';
    meta.appendChild(eB); meta.appendChild(d.createTextNode(' ' + (era ? era.label : city.era)));
    detail.appendChild(meta);

    var stats = d.createElement('div');
    stats.className = 'stat-box';
    [[color, city.stats.cultural_sites, 'Cultural Sites'],
     ['#f5c842', city.stats.unesco, 'UNESCO'],
     ['#00a86b', city.stats.traditions, 'Traditions']].forEach(function(s) {
      var box = d.createElement('div');
      var val = d.createElement('strong'); val.style.color = s[0]; val.textContent = s[1];
      var lbl = d.createElement('small'); lbl.textContent = s[2];
      box.appendChild(val); box.appendChild(d.createElement('br')); box.appendChild(lbl);
      stats.appendChild(box);
    });
    detail.appendChild(stats);

    if (topFlows.length) {
      var fh = d.createElement('h3');
      fh.style.cssText = 'font-size:1rem;margin:8px 0 4px';
      fh.textContent = 'Top Flows';
      detail.appendChild(fh);
      var ul = d.createElement('ul');
      ul.style.cssText = 'margin:0 0 0 18px;font-size:0.85rem';
      topFlows.forEach(function(f) {
        var li = d.createElement('li');
        li.style.color = CAT_COLORS[f.cat];
        li.textContent = f.icon + ' ' + f.name + ' → ' + f.to.join(', ');
        ul.appendChild(li);
      });
      detail.appendChild(ul);
    }

    if (city.events && city.events.length) {
      var eh = d.createElement('h3');
      eh.style.cssText = 'font-size:1rem;margin:8px 0 4px';
      eh.textContent = 'Events';
      detail.appendChild(eh);
      var eul = d.createElement('ul');
      eul.style.cssText = 'margin:0 0 0 18px;font-size:0.85rem';
      city.events.slice(0, 5).forEach(function(ev) {
        var li = d.createElement('li');
        li.textContent = ev.month + ' ' + ev.day + ' — ' + ev.name + ', ' + ev.location;
        eul.appendChild(li);
      });
      detail.appendChild(eul);
    }

    d.body.appendChild(detail);
  }

  var footer = d.createElement('div');
  footer.className = 'pdf-footer';
  var left = d.createElement('span'); left.textContent = 'México Cultural Flows 2026';
  var right = d.createElement('span'); right.textContent = date;
  footer.appendChild(left); footer.appendChild(right);
  d.body.appendChild(footer);

  d.close();
  img.onload = function() { setTimeout(function() { w.print(); }, 100); };
}
